<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>투썸 레시피 · 제조 순서 도우미</title>
<style>
  :root{
    --coffee-950:#181009;
    --coffee-900:#2b1a10;
    --coffee-800:#40270f;
    --coffee-700:#5a331d;
    --coffee-500:#8a5a34;
    --cream:#ffffff;
    --cream-2:#e8dcc8;
    --caramel:#e8912a;
    --caramel-2:#ffab3d;
    --mint:#5fe089;
    --danger:#ff6b52;
    --line: rgba(255,255,255,0.18);
    font-size:16px;
  }
  *{box-sizing:border-box;}
  html{ background: #181009; }
  html,body{margin:0;padding:0; min-height:100%;}
  body{
    background: var(--coffee-950);
    color: var(--cream);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    -webkit-tap-highlight-color: transparent;
    padding-bottom: 100px;
  }
  /* header */
  header{
    position: sticky; top:0; z-index: 40;
    background: linear-gradient(180deg, var(--coffee-950) 70%, rgba(28,18,11,0.85));
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--line);
  }
  .brand{
    display:flex; align-items:baseline; gap:8px; margin-bottom:10px;
  }
  .brand .mark{
    font-family: Georgia, "Noto Serif KR", serif;
    font-size: 1.05rem; letter-spacing: 0.06em; color: var(--caramel-2);
    border: 1px solid var(--caramel-2); border-radius: 3px; padding: 1px 6px;
  }
  .brand h1{
    font-size: 1.15rem; font-weight: 700; margin:0; color: var(--cream);
    letter-spacing: -0.01em;
  }
  .searchwrap{ position:relative; }
  #search{
    width:100%; padding: 12px 40px 12px 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--coffee-900); color: var(--cream);
    font-size: 1rem; outline:none;
  }
  #search:focus{ border-color: var(--caramel); }
  .searchwrap svg{ position:absolute; right:12px; top:50%; transform:translateY(-50%); opacity:0.6;}
  .tabs{ display:flex; gap:6px; margin-top:10px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex: 0 0 auto; padding:6px 12px; border-radius:999px; font-size:0.8rem;
    background: var(--coffee-900); border:1px solid var(--line); color: var(--cream-2);
    white-space:nowrap; cursor:pointer;
  }
  .tab.active{ background: var(--caramel); border-color: var(--caramel); color: var(--coffee-950); font-weight:700;}

  main{ padding: 14px 16px 40px; max-width: 720px; margin: 0 auto; background: var(--coffee-950); min-height: 60vh; }

  .empty{ text-align:center; color: var(--cream-2); padding: 60px 20px; font-size:0.9rem; }

  /* list */
  .item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding: 13px 4px; border-bottom: 1px solid var(--line); cursor:pointer;
  }
  .item .left{ flex:1; min-width:0; }
  .item .name{ font-size:0.98rem; font-weight:600; color: var(--cream); }
  .item .meta{ font-size:0.76rem; color: var(--caramel-2); margin-top:3px; }
  .item .sizes{ font-size:0.72rem; color: var(--cream-2); margin-left:6px; }
  .item{ border-left: 3px solid transparent; padding-left: 10px; }
  .addbtn{
    flex:0 0 auto; width:34px; height:34px; border-radius:50%;
    background: var(--coffee-800); border:1px solid var(--line); color: var(--caramel-2);
    font-size:1.2rem; display:flex; align-items:center; justify-content:center;
  }
  .addbtn:active{ background: var(--caramel); color:var(--coffee-950); }

  /* detail sheet */
  .sheet-backdrop{
    position:fixed; inset:0; background: rgba(0,0,0,0.55); z-index:60;
    display:none;
  }
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:61;
    background: var(--coffee-900); border-radius: 18px 18px 0 0;
    max-height: 88vh; overflow-y:auto;
    padding: 10px 18px 28px;
    transform: translateY(100%); transition: transform .22s ease;
    box-shadow: 0 -8px 30px rgba(0,0,0,0.4);
  }
  .sheet.open{ transform: translateY(0); }
  .sheet-backdrop.open{ display:block; }
  .grabber{ width:36px; height:4px; background: var(--line); border-radius:2px; margin: 6px auto 12px; }
  .sheet h2{ margin:0 0 2px; font-size:1.25rem; }
  .sheet .code{ color: var(--caramel-2); font-size:0.8rem; margin-bottom:14px; }
  .sizeToggle{ display:flex; gap:6px; margin-bottom:14px; }
  .sizeToggle button{
    flex:1; padding:9px 0; border-radius:10px; border:1px solid var(--line);
    background: var(--coffee-800); color:var(--cream-2); font-weight:700; font-size:0.85rem;
  }
  .sizeToggle button.active{ background: var(--caramel); color:var(--coffee-950); border-color:var(--caramel); }
  .sectionLabel{ font-size:0.78rem; color: var(--caramel-2); font-weight:700; margin: 16px 0 6px; letter-spacing:0.03em; }
  table.ing{ width:100%; border-collapse:collapse; font-size:0.88rem; }
  table.ing td{ padding:7px 4px; border-bottom:1px solid var(--line); }
  table.ing td:first-child{ color:var(--cream); }
  table.ing td:last-child{ text-align:right; color:var(--cream-2); }
  .steps{ margin:0; padding-left:0; list-style:none; }
  .steps li{ display:flex; gap:8px; padding:7px 0; font-size:0.9rem; line-height:1.4; border-bottom:1px dashed var(--line); }
  .steps li .n{ flex:0 0 20px; color:var(--caramel-2); font-weight:700; }
  .tierBadge{ display:inline-block; margin-top:14px; padding:4px 10px; border-radius:999px; font-size:0.75rem; font-weight:700; }
  .tier1{ background: rgba(200,130,58,0.22); color:var(--caramel-2); }
  .tier2{ background: rgba(126,168,138,0.2); color:var(--mint); }
  .tier3{ background: rgba(244,234,217,0.12); color:var(--cream-2); }
  .sheetAdd{
    margin-top:20px; width:100%; padding:14px; border-radius:12px; border:none;
    background: var(--caramel); color:var(--coffee-950); font-weight:800; font-size:1rem;
  }
  .closeX{ position:absolute; top:14px; right:16px; background:none; border:none; color:var(--cream-2); font-size:1.3rem; }

  /* order fab + panel */
  .fab{
    position:fixed; right:16px; bottom:16px; z-index:50;
    background: var(--caramel); color:var(--coffee-950); border-radius:999px;
    padding: 13px 18px; font-weight:800; font-size:0.95rem; box-shadow:0 6px 18px rgba(0,0,0,0.4);
    display:flex; align-items:center; gap:8px; border:none;
  }
  .fab .badge{ background: var(--coffee-950); color:var(--caramel-2); border-radius:999px; padding:1px 8px; font-size:0.8rem; }
  .fab.hidden{ display:none; }

  .orderPanel{
    position:fixed; inset:0; z-index:70; background: var(--coffee-950);
    transform: translateX(100%); transition: transform .22s ease; overflow-y:auto;
  }
  .orderPanel.open{ transform: translateX(0); }
  .opHeader{ position:sticky; top:0; background:var(--coffee-950); padding:16px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; z-index:2;}
  .opHeader h2{ margin:0; font-size:1.15rem; }
  .opBody{ padding: 6px 16px 120px; max-width:720px; margin:0 auto; }
  .queueEmpty{ text-align:center; padding:60px 20px; color:var(--cream-2); font-size:0.9rem; }

  .orderCard{
    background: var(--coffee-900); border:1px solid var(--line); border-radius:14px;
    padding:14px; margin-top:12px; position:relative;
  }
  .orderCard .rank{
    position:absolute; left:-10px; top:-10px; width:30px; height:30px; border-radius:50%;
    background: var(--caramel); color:var(--coffee-950); font-weight:800; font-size:0.95rem;
    display:flex; align-items:center; justify-content:center; box-shadow:0 3px 8px rgba(0,0,0,0.4);
  }
  .orderCard.done{ opacity:0.4; }
  .orderCard .oc-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .orderCard .oc-name{ font-weight:700; font-size:1rem; }
  .orderCard .oc-size{ font-size:0.75rem; color:var(--caramel-2); margin-top:2px; }
  .orderCard .oc-reason{ font-size:0.8rem; color:var(--cream-2); margin-top:6px; line-height:1.4; }
  .oc-actions{ display:flex; gap:8px; margin-top:10px; }
  .oc-actions button{ flex:1; padding:9px 0; border-radius:9px; border:1px solid var(--line); background:var(--coffee-800); color:var(--cream); font-size:0.85rem; font-weight:700;}
  .oc-actions button.done-btn{ background: var(--mint); color:var(--coffee-950); border-color:var(--mint); }
  .oc-actions button.done-btn.undo{ background: var(--coffee-800); color:var(--cream-2); }
  .oc-actions button.del-btn{ background: var(--danger); color: var(--cream); border-color:var(--danger); flex:0 0 46px; }

  .guideNote{ background: var(--coffee-800); border-radius:12px; padding:12px 14px; font-size:0.8rem; color:var(--cream-2); margin-top:14px; line-height:1.5;}
  .guideNote b{ color:var(--caramel-2); }

  .clearAll{ font-size:0.8rem; color: var(--danger); background:none; border:none; }

  /* customization ref */
  .refBtn{ width:100%; text-align:left; background:var(--coffee-900); border:1px solid var(--line); color:var(--cream-2); padding:12px 14px; border-radius:12px; font-size:0.85rem; margin: 6px 0 14px; }
</style>
</head>
<body>

<header>
  <div class="brand"><span class="mark">TS</span><h1>레시피 &amp; 제조 순서 도우미</h1></div>
  <div class="searchwrap">
    <input id="search" placeholder="음료 이름 또는 코드 검색 (예: 라떼, VL, 아인슈페너)" autocomplete="off">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
  </div>
  <div class="tabs" id="tabs"></div>
</header>

<main>
  <button class="refBtn" id="refToggle">⚙ 고객 요청사항(시럽·휘핑·우유변경·드리즐) 기준표 보기</button>
  <div id="refPanel" style="display:none;"></div>
  <div id="list"></div>
  <div class="empty" id="emptyMsg" style="display:none;">검색 결과가 없어요.</div>
</main>

<button class="fab" id="fab"><span>🧾 주문 목록</span><span class="badge" id="fabCount">0</span></button>

<div class="sheet-backdrop" id="backdrop"></div>
<div class="sheet" id="sheet">
  <button class="closeX" id="sheetClose">✕</button>
  <div class="grabber"></div>
  <div id="sheetContent"></div>
</div>

<div class="orderPanel" id="orderPanel">
  <div class="opHeader">
    <h2>🧾 현재 주문 · 제조 순서</h2>
    <div style="display:flex; gap:14px; align-items:center;">
      <button class="clearAll" id="clearAll">전체 비우기</button>
      <button class="closeX" id="opClose" style="position:static;">✕</button>
    </div>
  </div>
  <div class="opBody" id="opBody"></div>
</div>

const CUSTOM_OPTIONS = [
["시럽(바닐라/헤이즐넛/카라멜)","HOT R:3 L:4 · ICED R:3 L:4 M:5 (pump)"],
["휘핑크림","HOT 30g · ICED R:25 L:30 M:30 (g)"],
["우유 변경(무지방/저지방/락토프리/두유/오틀리)","기존 우유와 동량으로 교체"],
["카라멜 드리즐","10g (카라멜 마키아또와 동일)"],
["초콜릿 드리즐","5g (카라멜 마키아또에서 가장자리 원형 2회 제외)"],
["토핑 - 다크 크리스피 초코볼","10g"],
];

/* ===================== STATE ===================== */
let order = []; // {uid, name, code, size, ing, steps}
let activeCat = "전체";
let sheetItem = null;

const CATS = ["전체", ...Array.from(new Set(MENU.map(m=>m.cat)))];

// 카테고리별 고유 색상 (다크 배경에서도 선명하게 보이도록 채도/명도 조정)
const CAT_COLORS = {
  "커피":       "#ff9f2e",
  "콜드브루":   "#3fa9f5",
  "티":         "#4fd15a",
  "블렌디드":   "#ff5f8f",
  "에이드":     "#1fd6c4",
  "드링크":     "#b06bff",
  "전통음료":   "#ffd23f",
  "아이스크림": "#5cc8ff",
  "시즌(5월)":  "#ff5fa8",
  "시즌(6월)":  "#ff4d4d",
};
function catColor(cat){ return CAT_COLORS[cat] || "#ff9f2e"; }

/* ===================== RENDER: TABS ===================== */
const tabsEl = document.getElementById('tabs');
CATS.forEach(cat=>{
  const b = document.createElement('div');
  const col = cat==="전체" ? "#ff9f2e" : catColor(cat);
  b.className = 'tab' + (cat===activeCat?' active':'');
  b.textContent = cat;
  b.style.setProperty('--catcol', col);
  if(cat===activeCat){ b.style.background = col; b.style.borderColor = col; }
  b.onclick = ()=>{
    activeCat = cat;
    document.querySelectorAll('.tab').forEach(t=>{ t.classList.remove('active'); t.style.background=''; t.style.borderColor=''; t.style.color=''; });
    b.classList.add('active'); b.style.background = col; b.style.borderColor = col; b.style.color = '#181009';
    renderList();
  };
  tabsEl.appendChild(b);
});

/* ===================== SEARCH / LIST ===================== */
const listEl = document.getElementById('list');
const emptyMsg = document.getElementById('emptyMsg');
const searchEl = document.getElementById('search');

function matches(item, q){
  if(!q) return true;
  q = q.trim().toLowerCase();
  return item.n.toLowerCase().includes(q) || (item.c||'').toLowerCase().includes(q);
}

function renderList(){
  const q = searchEl.value;
  const filtered = MENU.filter(m => (activeCat==="전체" || m.cat===activeCat) && matches(m,q));
  listEl.innerHTML = '';
  emptyMsg.style.display = filtered.length ? 'none' : 'block';
  filtered.forEach((item)=>{
    const idx = MENU.indexOf(item);
    const col = catColor(item.cat);
    const row = document.createElement('div');
    row.className = 'item';
    row.style.borderLeftColor = col;
    row.innerHTML = `
      <div class="left">
        <div class="name">${item.n}${item.c? ' <span style="color:var(--cream-2);font-weight:400;font-size:0.78rem;">'+item.c+'</span>':''}</div>
        <div class="meta"><span style="color:${col};font-weight:700;">${item.cat}</span> <span class="sizes">· ${item.sizes.join('/')}</span></div>
      </div>
      <div class="addbtn" data-idx="${idx}" style="color:${col};">＋</div>
    `;
    row.querySelector('.left').onclick = ()=> openSheet(item);
    row.querySelector('.addbtn').onclick = (e)=>{ e.stopPropagation(); quickAdd(item); };
    listEl.appendChild(row);
  });
}
searchEl.addEventListener('input', renderList);
renderList();

/* ===================== DETAIL SHEET ===================== */
const sheet = document.getElementById('sheet');
const backdrop = document.getElementById('backdrop');
const sheetContent = document.getElementById('sheetContent');
let sheetSize = null;

function classify(item){
  const t = item.steps.join(' ');
  if(/블렌더|빙삭/.test(t)) return {tier:1, cls:'tier1', label:'🧃 블렌더/빙삭 — 먼저 착수'};
  if(/스팀|우리기|4분/.test(t)) return {tier:2, cls:'tier2', label:'♨️ 스팀·우려내기 — 중간 착수'};
  return {tier:3, cls:'tier3', label:'⚡ 단순 조합 — 나중에 착수'};
}

function openSheet(item){
  sheetItem = item;
  sheetSize = item.sizes[0];
  renderSheet();
  sheet.classList.add('open');
  backdrop.classList.add('open');
}
function closeSheet(){
  sheet.classList.remove('open');
  backdrop.classList.remove('open');
}
document.getElementById('sheetClose').onclick = closeSheet;
backdrop.onclick = closeSheet;

function renderSheet(){
  const item = sheetItem;
  const tier = classify(item);
  const ingRows = item.ing.map(row=>{
    const val = row[sheetSize];
    if(val===undefined || val===null) return '';
    return `<tr><td>${row.m}</td><td>${val} ${row.u||''}</td></tr>`;
  }).join('');
  const stepsLi = item.steps.map((s,i)=>`<li><span class="n">${i+1}</span><span>${s}</span></li>`).join('');
  const col = catColor(item.cat);
  sheetContent.innerHTML = `
    <h2>${item.n}</h2>
    <div class="code" style="color:${col};font-weight:700;">${item.cat}${item.c? ' · '+item.c : ''}</div>
    <div class="sizeToggle">
      ${item.sizes.map(s=>`<button data-s="${s}" class="${s===sheetSize?'active':''}" style="${s===sheetSize?`background:${col};border-color:${col};color:#181009;`:''}">${s==='단일'?'단일 사이즈':s}</button>`).join('')}
    </div>
    <div class="sectionLabel">재료 (${sheetSize})</div>
    <table class="ing">${ingRows}</table>
    <div class="sectionLabel">제조 공정</div>
    <ul class="steps">${stepsLi}</ul>
    <div class="tierBadge ${tier.cls}">${tier.label}</div>
    <button class="sheetAdd" id="sheetAddBtn" style="background:${col};">이 음료 주문에 담기 (${sheetSize})</button>
  `;
  sheetContent.querySelectorAll('.sizeToggle button').forEach(b=>{
    b.onclick = ()=>{ sheetSize = b.dataset.s; renderSheet(); };
  });
  document.getElementById('sheetAddBtn').onclick = ()=>{
    addToOrder(item, sheetSize);
    closeSheet();
    openOrderPanel();
  };
}

function quickAdd(item){
  addToOrder(item, item.sizes[0]);
  fabPulse();
}
function fabPulse(){
  const fab = document.getElementById('fab');
  fab.style.transform = 'scale(1.08)';
  setTimeout(()=> fab.style.transform = 'scale(1)', 140);
}

/* ===================== ORDER QUEUE ===================== */
function addToOrder(item, size){
  order.push({
    uid: Date.now()+Math.random(),
    name: item.n, code: item.c, cat: item.cat, size,
    steps: item.steps, done:false,
    tier: classify(item)
  });
  updateFab();
}
function updateFab(){
  const cnt = order.filter(o=>!o.done).length;
  document.getElementById('fabCount').textContent = cnt;
  document.getElementById('fab').classList.toggle('hidden', order.length===0);
}

function suggestOrder(list){
  // tier1(블렌더/빙삭) 우선 → tier2(스팀) → tier3(단순), 동일 tier 내에서는 공정 단계 수 많은 순
  return [...list].sort((a,b)=>{
    if(a.tier.tier !== b.tier.tier) return a.tier.tier - b.tier.tier;
    return b.steps.length - a.steps.length;
  });
}

const orderPanel = document.getElementById('orderPanel');
const opBody = document.getElementById('opBody');
document.getElementById('fab').onclick = openOrderPanel;
document.getElementById('opClose').onclick = ()=> orderPanel.classList.remove('open');
document.getElementById('clearAll').onclick = ()=>{
  if(order.length && confirm('현재 주문 목록을 모두 비울까요?')){ order=[]; updateFab(); renderOrder(); }
};

function openOrderPanel(){
  renderOrder();
  orderPanel.classList.add('open');
}

function renderOrder(){
  if(order.length===0){
    opBody.innerHTML = `<div class="queueEmpty">담긴 음료가 없어요.<br>메뉴에서 ＋ 버튼을 눌러 주문을 담아보세요.</div>`;
    return;
  }
  const pending = order.filter(o=>!o.done);
  const done = order.filter(o=>o.done);
  const sorted = suggestOrder(pending);

  const reasonText = t => t.tier===1 ? '오래 걸리는 블렌더/빙삭 작업 — 지금 바로 시작해야 다른 음료와 완성 타이밍이 맞아요.'
                        : t.tier===2 ? '스팀우유·우려내기가 필요해 시간이 걸려요 — 두 번째로 착수하세요.'
                        : '붓고 담는 단순 조합이라 가장 빨라요 — 마지막에 착수해도 늦지 않아요.';

  let html = '';
  sorted.forEach((o, i)=>{
    const col = catColor(o.cat);
    html += `
    <div class="orderCard" style="border-left:3px solid ${col};">
      <div class="rank" style="background:${col};">${i+1}</div>
      <div class="oc-top">
        <div>
          <div class="oc-name">${o.name}</div>
          <div class="oc-size"><span style="color:${col};font-weight:700;">${o.cat}</span> · ${o.size} 사이즈</div>
        </div>
      </div>
      <div class="oc-reason">${reasonText(o.tier)}</div>
      <div class="oc-actions">
        <button class="done-btn" data-uid="${o.uid}">✓ 제조 완료</button>
        <button class="del-btn" data-uid="${o.uid}">✕</button>
      </div>
    </div>`;
  });

  if(done.length){
    html += `<div class="sectionLabel" style="margin-top:22px;">완료됨</div>`;
    done.forEach(o=>{
      const col = catColor(o.cat);
      html += `
      <div class="orderCard done" style="border-left:3px solid ${col};">
        <div class="oc-top">
          <div>
            <div class="oc-name">${o.name}</div>
            <div class="oc-size"><span style="color:${col};font-weight:700;">${o.cat}</span> · ${o.size} 사이즈</div>
          </div>
        </div>
        <div class="oc-actions">
          <button class="done-btn undo" data-uid="${o.uid}">되돌리기</button>
          <button class="del-btn" data-uid="${o.uid}">✕</button>
        </div>
      </div>`;
    });
  }

  html += `<div class="guideNote"><b>착수 순서 로직</b> · 여러 음료가 동시에 들어오면, 시간이 오래 걸리는 작업(블렌더·빙삭)부터 시작하고, 스팀우유 작업을 다음으로, 붓기만 하면 되는 단순 음료를 가장 나중에 시작하면 모든 음료가 비슷한 시점에 완성돼요.</div>`;

  opBody.innerHTML = html;

  opBody.querySelectorAll('.done-btn').forEach(b=>{
    b.onclick = ()=>{
      const o = order.find(x=>x.uid==b.dataset.uid);
      o.done = !o.done;
      updateFab(); renderOrder();
    };
  });
  opBody.querySelectorAll('.del-btn').forEach(b=>{
    b.onclick = ()=>{
      order = order.filter(x=>x.uid!=b.dataset.uid);
      updateFab(); renderOrder();
    };
  });
}
updateFab();

/* ===================== CUSTOM OPTIONS REF ===================== */
const refToggle = document.getElementById('refToggle');
const refPanel = document.getElementById('refPanel');
refToggle.onclick = ()=>{
  const show = refPanel.style.display === 'none';
  refPanel.style.display = show ? 'block' : 'none';
  if(show && !refPanel.dataset.filled){
    refPanel.dataset.filled = '1';
    refPanel.innerHTML = `<table class="ing" style="margin-bottom:10px;">${CUSTOM_OPTIONS.map(([a,b])=>`<tr><td>${a}</td><td style="text-align:right;">${b}</td></tr>`).join('')}</table>`;
  }
};
</script>
</body>
