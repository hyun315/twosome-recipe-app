<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>투썸 레시피 · 제조 순서 도우미</title>
<style>
  :root{
    /* 짙은 요소(헤더·바텀시트) 전용 */
    --dark:#241408;
    --dark-2:#3a2210;
    /* 본문은 항상 밝은 배경 + 진한 글씨 = 어떤 환경에서도 대비가 보장됨 */
    --paper:#fffdf9;
    --paper-2:#f4ead9;
    --ink:#241408;
    --ink-2:#5c4632;
    --white:#ffffff;
    --caramel:#c9700a;
    --caramel-strong:#a85800;
    --mint:#1f9e52;
    --danger:#d43b1f;
    --line: rgba(36,20,8,0.14);
    --line-dark: rgba(255,255,255,0.18);
    font-size:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    -webkit-tap-highlight-color: transparent;
    padding-bottom: 100px;
  }
  /* header (짙은 배경 — 브랜드 포인트) */
  header{
    position: sticky; top:0; z-index: 40;
    background: var(--dark);
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--line-dark);
  }
  .brand{ display:flex; align-items:baseline; gap:8px; margin-bottom:10px; }
  .brand .mark{
    font-family: Georgia, "Noto Serif KR", serif;
    font-size: 1.05rem; letter-spacing: 0.06em; color: #ffb457;
    border: 1px solid #ffb457; border-radius: 3px; padding: 1px 6px;
  }
  .brand h1{ font-size: 1.15rem; font-weight: 700; margin:0; color: #ffffff; letter-spacing: -0.01em; }
  .searchwrap{ position:relative; }
  #search{
    width:100%; padding: 12px 40px 12px 14px; border-radius: 12px;
    border: 1px solid var(--line-dark); background: var(--dark-2); color: #ffffff;
    font-size: 1rem; outline:none;
  }
  #search::placeholder{ color:#cbb9a3; }
  #search:focus{ border-color: #ffb457; }
  .searchwrap svg{ position:absolute; right:12px; top:50%; transform:translateY(-50%); color:#cbb9a3;}
  .tabs{ display:flex; gap:6px; margin-top:10px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex: 0 0 auto; padding:6px 12px; border-radius:999px; font-size:0.8rem;
    background: var(--dark-2); border:1px solid var(--line-dark); color: #e8dcc8;
    white-space:nowrap; cursor:pointer; font-weight:600;
  }
  .tab.active{ color: #ffffff; font-weight:800;}

  /* 본문: 밝은 배경 고정 */
  main{ padding: 14px 16px 40px; max-width: 720px; margin: 0 auto; background: var(--paper); }

  .empty{ text-align:center; color: var(--ink-2); padding: 60px 20px; font-size:0.9rem; background:var(--paper); }

  /* list */
  .item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding: 13px 4px; border-bottom: 1px solid var(--line); cursor:pointer;
    background: var(--paper); border-left: 4px solid transparent; padding-left: 10px;
  }
  .item .left{ flex:1; min-width:0; }
  .item .name{ font-size:1rem; font-weight:700; color: var(--ink); }
  .item .meta{ font-size:0.78rem; font-weight:700; margin-top:3px; }
  .item .sizes{ font-size:0.76rem; color: var(--ink-2); font-weight:500; margin-left:6px; }
  .addbtn{
    flex:0 0 auto; width:36px; height:36px; border-radius:50%;
    background: var(--paper-2); border:1px solid var(--line); color: var(--caramel-strong);
    font-size:1.3rem; font-weight:700; display:flex; align-items:center; justify-content:center;
  }
  .addbtn:active{ background: var(--caramel); color:#ffffff; border-color:var(--caramel); }

  /* 인라인 레시피 펼치기 패널 (목록/주문 카드 공용, 밝은 배경) */
  .detailPanel{
    background: var(--paper-2); border:1px solid var(--line); border-radius:14px;
    padding:14px 14px 16px; margin: 4px 4px 12px;
  }
  .sizeToggle{ display:flex; gap:6px; margin-bottom:12px; }
  .sizeToggle button{
    flex:1; padding:9px 0; border-radius:10px; border:1px solid var(--line);
    background: #ffffff; color:var(--ink); font-weight:700; font-size:0.85rem;
  }
  .cupStepper{ display:flex; align-items:center; justify-content:space-between; gap:10px; background:#ffffff; border:1px solid var(--line); border-radius:10px; padding:9px 12px; margin-bottom:10px; }
  .cupLabel{ font-size:0.82rem; font-weight:700; color:var(--ink); }
  .cupCtrl{ display:flex; align-items:center; gap:8px; flex:0 0 auto; }
  .sectionLabel{ font-size:0.78rem; color: var(--caramel-strong); font-weight:800; margin: 14px 0 6px; letter-spacing:0.03em; }
  table.ing{ width:100%; border-collapse:collapse; font-size:0.9rem; }
  table.ing td{ padding:8px 4px; border-bottom:1px solid var(--line); }
  table.ing td:first-child{ color:var(--ink); }
  table.ing td:last-child{ text-align:right; color:var(--ink-2); font-weight:700; }
  .steps{ margin:0; padding-left:0; list-style:none; }
  .steps li{ display:flex; gap:8px; padding:8px 0; font-size:0.92rem; line-height:1.5; border-bottom:1px dashed var(--line); color:var(--ink); }
  .steps li .n{ flex:0 0 20px; color:var(--caramel-strong); font-weight:800; }
  .tierBadge{ display:inline-block; margin-top:14px; padding:5px 12px; border-radius:999px; font-size:0.78rem; font-weight:800; }
  .tier1{ background: #ffb457; color:#241408; }
  .tier2{ background: #6ee08f; color:#0c2f18; }
  .tier3{ background: #e8dcc8; color:#241408; }
  .detailAdd{
    margin-top:16px; width:100%; padding:14px; border-radius:12px; border:none;
    color: #ffffff; font-weight:800; font-size:1rem;
  }
  .closeX{ position:absolute; top:14px; right:16px; background:none; border:none; color:#e8dcc8; font-size:1.3rem; }

  /* order fab + panel */
  .fab{
    position:fixed; right:16px; bottom:16px; z-index:50;
    background: var(--caramel); color:#ffffff; border-radius:999px;
    padding: 13px 18px; font-weight:800; font-size:0.95rem; box-shadow:0 6px 18px rgba(0,0,0,0.4);
    display:flex; align-items:center; gap:8px; border:none;
  }
  .fab .badge{ background: #ffffff; color:var(--caramel-strong); border-radius:999px; padding:1px 8px; font-size:0.8rem; font-weight:800; }
  .fab.hidden{ display:none; }

  .orderPanel{
    position:fixed; inset:0; z-index:70; background: var(--paper);
    transform: translateX(100%); transition: transform .22s ease; overflow-y:auto;
  }
  .orderPanel.open{ transform: translateX(0); }
  .opHeader{ position:sticky; top:0; background:var(--dark); padding:16px; border-bottom:1px solid var(--line-dark); display:flex; align-items:center; justify-content:space-between; z-index:2; color:#ffffff;}
  .opHeader h2{ margin:0; font-size:1.15rem; color:#ffffff; }
  .opBody{ padding: 14px 16px 120px; max-width:720px; margin:0 auto; background:var(--paper); }
  .queueEmpty{ text-align:center; padding:60px 20px; color:var(--ink-2); font-size:0.9rem; }

  .orderRow{ display:flex; gap:10px; margin-top:10px; align-items:stretch; }
  .compactCard{
    flex:1; min-width:0; background: var(--paper-2); border:1.5px solid var(--line); border-radius:13px;
    padding:10px; position:relative;
  }
  .compactCard .rank{
    position:absolute; left:-7px; top:-7px; width:22px; height:22px; border-radius:50%;
    background: var(--caramel); color:#ffffff; font-weight:800; font-size:0.72rem;
    display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,0.3);
  }
  .compactCard.done{ opacity:0.55; }
  .compactCard .cc-top{ display:flex; align-items:center; gap:8px; cursor:pointer; }
  .compactCard .cc-name{ font-weight:800; font-size:0.85rem; color:var(--ink); line-height:1.25;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .compactCard .cc-meta{ font-size:0.68rem; margin-top:2px; font-weight:600; color:var(--ink-2); }
  .compactCard .cc-qty{ display:flex; align-items:center; justify-content:space-between; margin-top:8px; }
  .compactCard .cc-qty .qty-btn{ width:26px; height:26px; border-radius:7px; font-size:0.9rem; padding:0; }
  .compactCard .cc-qty .qty-num{ font-size:0.8rem; min-width:auto; }
  .cc-actions{ display:flex; gap:6px; margin-top:8px; }
  .cc-actions button{ flex:1; padding:6px 0; border-radius:8px; border:1px solid var(--line); background:#ffffff; color:var(--ink); font-size:0.72rem; font-weight:700;}
  .cc-actions button.done-btn{ background: var(--mint); color:#ffffff; border-color:var(--mint); }
  .cc-actions button.done-btn.undo{ background: #ffffff; color:var(--ink-2); }
  .cc-actions button.del-btn{ background: var(--danger); color: #ffffff; border-color:var(--danger); flex:0 0 30px; }
  .oc-reason{ font-size:0.82rem; color:var(--ink-2); line-height:1.45; }

  .guideNote{ background: var(--paper-2); border:1px solid var(--line); border-radius:12px; padding:12px 14px; font-size:0.82rem; color:var(--ink-2); margin-top:14px; line-height:1.55;}
  .guideNote b{ color:var(--caramel-strong); }

  .clearAll{ font-size:0.8rem; color: #ffb457; background:none; border:none; font-weight:700; }

  /* customization ref */
  .refBtn{ width:100%; text-align:left; background:var(--paper-2); border:1px solid var(--line); color:var(--ink); font-weight:700; padding:12px 14px; border-radius:12px; font-size:0.85rem; margin: 6px 0 14px; }

  /* drink icon thumbnail */
  .thumb{
    flex:0 0 auto; border-radius:12px; background:#ffffff;
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
  }
  .thumb-dark{ background:#33200f; border-color: var(--line-dark); }

  /* qty stepper */
  .oc-qty{ display:flex; align-items:center; gap:10px; margin-top:10px; }
  .qty-btn{
    width:34px; height:34px; border-radius:9px; border:1px solid var(--line);
    background:#ffffff; color:var(--ink); font-size:1.1rem; font-weight:800; line-height:1;
  }
  .qty-btn:active{ background: var(--paper-2); }
  .qty-num{ font-weight:800; font-size:0.95rem; color:var(--ink); min-width:38px; text-align:center; }
  .oc-clickable{ cursor:pointer; }

  /* 재료 읽어주기(TTS) 버튼 */
  .ingHead{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:14px; }
  .ingHead .sectionLabel{ margin:0; }
  .speakBtn{
    flex:0 0 auto; padding:6px 12px; border-radius:999px; border:1px solid var(--line);
    background:#ffffff; color:var(--caramel-strong); font-weight:800; font-size:0.78rem;
  }
  .speakBtn.speaking{ background: var(--caramel-strong); color:#ffffff; border-color:var(--caramel-strong); }

  /* POS 사진 인식 */
  #scanStatus{ background:var(--paper-2); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin: 6px 0 14px; font-size:0.85rem; color:var(--ink); }
  #scanStatus .scanTitle{ font-weight:800; margin-bottom:6px; }
  #scanStatus ul{ margin:6px 0 0; padding-left:18px; }
  #scanStatus li{ margin:3px 0; }
  #scanStatus .ok{ color:#1c7a34; font-weight:700; }
  #scanStatus .miss{ color:var(--danger); font-weight:700; }
  #scanStatus .scanClose{ margin-top:10px; background:#fff; border:1px solid var(--line); border-radius:9px; padding:8px 12px; font-weight:700; font-size:0.82rem; }
</style>
</head>
<body>

<header>
  <div class="brand"><span class="mark">TS</span><h1>레시피 &amp; 제조 순서 도우미</h1></div>
  <div class="searchwrap">
    <input id="search" placeholder="음료 이름 또는 코드 검색 (예: 라떼, VL, 아인슈페너)" autocomplete="off">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
  </div>
  <div class="tabs" id="tabs"></div>
</header>

<main>
  <button class="refBtn" id="scanBtn" style="background:var(--dark); color:#fff; border-color:var(--dark); display:flex; align-items:center; justify-content:center; gap:8px; font-weight:800;">📷 POS 화면 사진으로 주문 인식</button>
  <input type="file" id="scanInput" accept="image/*" capture="environment" style="display:none;">
  <div id="scanStatus" style="display:none;"></div>
  <button class="refBtn" id="refToggle">⚙ 고객 요청사항(시럽·휘핑·우유변경·드리즐) 기준표 보기</button>
  <div id="refPanel" style="display:none;"></div>
  <div id="list"></div>
  <div class="empty" id="emptyMsg" style="display:none;">검색 결과가 없어요.</div>
</main>

<button class="fab" id="fab"><span>🧾 주문 목록</span><span class="badge" id="fabCount">0</span></button>

<div class="orderPanel" id="orderPanel">
  <div class="opHeader">
    <h2>🧾 현재 주문 · 제조 순서</h2>
    <div style="display:flex; gap:14px; align-items:center;">
      <button class="clearAll" id="clearAll">전체 비우기</button>
      <button class="closeX" id="opClose" style="position:static;">✕</button>
    </div>
  </div>
  <div class="opBody" id="opBody"></div>
</div>

function drinkType(item){
  const iced = /아이스|\(ICED\)/i.test(item.n);
  if(classify(item).tier===1) return 'blend';
  return iced ? 'iced' : 'hot';
}
function cupSVG(item, px){
  const col = catColorDark(item.cat);
  const type = drinkType(item);
  let inner = '';
  if(type==='hot'){
    inner = `
      <path d="M8 12h20v14a6 6 0 0 1-6 6H14a6 6 0 0 1-6-6V12z" fill="${col}"/>
      <path d="M28 15h3.2a4 4 0 0 1 0 8H28" fill="none" stroke="${col}" stroke-width="2.4"/>
      <path d="M12 6c1-2 3-2 3 0s2 2 3 0" stroke="${col}" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <path d="M19 6c1-2 3-2 3 0s2 2 3 0" stroke="${col}" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
  } else if(type==='iced'){
    inner = `
      <path d="M10 10h20l-2.2 24a3 3 0 0 1-3 2.8H15.2a3 3 0 0 1-3-2.8L10 10z" fill="${col}" opacity="0.88"/>
      <rect x="14" y="16" width="6" height="6" rx="1.2" fill="#ffffff" opacity="0.85" transform="rotate(-12 17 19)"/>
      <rect x="20" y="23" width="5" height="5" rx="1.2" fill="#ffffff" opacity="0.7" transform="rotate(10 22 25)"/>
      <line x1="25" y1="4" x2="27.5" y2="17" stroke="${col}" stroke-width="2.4" stroke-linecap="round"/>`;
  } else {
    inner = `
      <path d="M11 15h18l-1.6 19.5a3 3 0 0 1-3 2.7H15.6a3 3 0 0 1-3-2.7L11 15z" fill="${col}"/>
      <ellipse cx="20" cy="15" rx="9" ry="3" fill="${col}"/>
      <ellipse cx="20" cy="13.4" rx="6.6" ry="2" fill="#ffffff" opacity="0.9"/>
      <line x1="22" y1="4" x2="23.5" y2="16" stroke="${col}" stroke-width="2.4" stroke-linecap="round"/>`;
  }
  return `<svg width="${px}" height="${px}" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
}
function thumb(item, boxPx, dark){
  if(item.img){
    return `<div class="thumb ${dark?'thumb-dark':''}" style="width:${boxPx}px;height:${boxPx}px;overflow:hidden;padding:0;"><img src="${item.img}" style="width:100%;height:100%;object-fit:cover;" loading="lazy" alt=""></div>`;
  }
  return `<div class="thumb ${dark?'thumb-dark':''}" style="width:${boxPx}px;height:${boxPx}px;">${cupSVG(item, Math.round(boxPx*0.72))}</div>`;
}

const tabsEl = document.getElementById('tabs');
CATS.forEach(cat=>{
  const b = document.createElement('div');
  const col = cat==="전체" ? "#ff9f2e" : catColorBright(cat);
  b.className = 'tab' + (cat===activeCat?' active':'');
  b.textContent = cat;

    document.querySelectorAll('.tab').forEach(t=>{ t.classList.remove('active'); t.style.background=''; t.style.borderColor=''; t.style.color=''; });
    b.classList.add('active'); b.style.background = col; b.style.borderColor = col; b.style.color = '#241408';
    renderList();
  };
  tabsEl.appendChild(b);
});

const listEl = document.getElementById('list');

function matches(item, q){
  if(!q) return true;
  q = q.trim().toLowerCase();
  return item.n.toLowerCase().includes(q) || (item.c||'').toLowerCase().includes(q);
}

function keyOf(item){ return item.n+'__'+item.c; }

function classify(item){
  const t = item.steps.join(' ');
  if(/블렌더|빙삭/.test(t)) return {tier:1, cls:'tier1', label:'🧃 블렌더/빙삭 — 먼저 착수'};
  if(/스팀|우리기|4분/.test(t)) return {tier:2, cls:'tier2', label:'♨️ 스팀·우려내기 — 중간 착수'};
  return {tier:3, cls:'tier3', label:'⚡ 단순 조합 — 나중에 착수'};
}

// 블렌디드(블렌더/빙삭) 음료의 잔 수 배율 계산 — 숫자·"숫자(메모)" 형태 모두 처리
function trimNum(n){
  const r = Math.round(n*100)/100;
  return String(r);
}
function scaleVal(val, mult){
  if(!mult || mult===1) return val;
  if(typeof val === 'number') return trimNum(val*mult);
  if(typeof val === 'string'){
    const m = val.match(/^(\d+(?:\.\d+)?)/);
    if(m){ return trimNum(parseFloat(m[1])*mult); }
  }
  return val;
}
function ingRowsHTML(item, size, cup, isBlend){
  return item.ing.map(row=>{
    let val = row[size];
    if(val===undefined || val===null) return '';
    if(isBlend && cup && cup!==1) val = scaleVal(val, cup);
    return `<tr><td>${row.m}</td><td>${val} ${row.u||''}</td></tr>`;
  }).join('');
}

// 샷/펌프는 바리스타 용어인 "원샷·투샷·쓰리샷" 식으로 읽고, 나머지 단위는 한글 단위명으로 읽는다.
const SHOT_PUMP_WORDS = {1:'원',2:'투',3:'쓰리',4:'포',5:'파이브',6:'식스',7:'세븐',8:'에잇',9:'나인',10:'텐'};
const UNIT_WORDS = { g:'그램', kg:'킬로그램', ml:'밀리리터', l:'리터', ea:'개', cm:'센티미터', pinch:'꼬집', tsp:'티스푼', tbsp:'큰술', cup:'컵', fl_oz:'플루이드온스', oz:'온스', lb:'파운드' };

function numOnly(val){
  const s = String(val);
  const m = s.match(/^(\d+(?:\.\d+)?)/);
  if(m) return m[1];
  return s.replace(/\([^)]*\)/g,'').trim();
}
function speakUnitPhrase(numStr, unit){
  const n = parseFloat(numStr);
  if(unit==='shot') return (SHOT_PUMP_WORDS[n] || numStr) + '샷';
  if(unit==='pump') return (SHOT_PUMP_WORDS[n] || numStr) + '펌프';
  if(!unit) return numStr;
  return numStr + (UNIT_WORDS[unit] || unit);
}
function ingLines(item, size, cup, isBlend){
  return item.ing.map(row=>{
    let val = row[size];
    if(val===undefined || val===null) return null;
    if(isBlend && cup && cup!==1) val = scaleVal(val, cup);
    const numStr = numOnly(val);
    const name = String(row.m).replace(/\([^)]*\)/g,'').trim();
    return `${name} ${speakUnitPhrase(numStr, row.u)}`;
  }).filter(Boolean);
}
function stopSpeaking(){
  speakState.active = false;
  if(speakState.timer){ clearTimeout(speakState.timer); speakState.timer = null; }
  if(window.speechSynthesis) speechSynthesis.cancel();
  document.querySelectorAll('.speakBtn').forEach(b=>{ b.textContent = '🔊 재료 읽어주기'; b.classList.remove('speaking'); });
}
function toggleSpeak(btnEl, item, size, cup, isBlend){
  if(speakState.active){ stopSpeaking(); return; }
  if(!window.speechSynthesis){ alert('이 브라우저는 음성 읽기를 지원하지 않아요.'); return; }
  stopSpeaking();
  speakState.active = true;
  btnEl.textContent = '⏹ 읽기 중지';
  btnEl.classList.add('speaking');
  const lines = ingLines(item, size, cup, isBlend);
  if(lines.length===0){ stopSpeaking(); return; }
  function speakOne(idx){
    if(!speakState.active) return;
    if(idx>=lines.length){
      speakState.timer = setTimeout(()=> speakOne(0), 1000);
      return;
    }
    const utter = new SpeechSynthesisUtterance(lines[idx]);
    utter.lang = 'ko-KR';
    utter.rate = 0.98;
    utter.onend = ()=>{ if(speakState.active) speakOne(idx+1); };
    utter.onerror = ()=>{ if(speakState.active) speakOne(idx+1); };
    speechSynthesis.speak(utter);
  }
  speakOne(0);
}

function addToOrder(item, size, qty){
  qty = qty || 1;
  const existing = order.find(o=> !o.done && o.name===item.n && o.size===size);
  if(existing){
    existing.qty += qty;
  } else {
    order.push({
      uid: Date.now()+Math.random(),
      name: item.n, code: item.c, cat: item.cat, size,
      steps: item.steps, done:false, qty,
      menuItem: item,
      tier: classify(item)
    });
  }
  updateFab();
}
function updateFab(){
  const cnt = order.filter(o=>!o.done).reduce((s,o)=>s+o.qty,0);
  document.getElementById('fabCount').textContent = cnt;
  document.getElementById('fab').classList.toggle('hidden', order.length===0);
}

function suggestOrder(list){
  // tier1(블렌더/빙삭) 우선 → tier2(스팀) → tier3(단순), 동일 tier 내에서는 공정 단계 수 많은 순
  return [...list].sort((a,b)=>{
    if(a.tier.tier !== b.tier.tier) return a.tier.tier - b.tier.tier;
    return b.steps.length - a.steps.length;
  });
}

function buildOrderDetail(o, col){
  const item = o.menuItem;
  const tier = classify(item);
  const isBlend = tier.tier===1;
  const cup = isBlend ? o.qty : 1;
  const ingRows = ingRowsHTML(item, o.size, cup, isBlend);
  const stepsLi = item.steps.map((s,i)=>`<li><span class="n">${i+1}</span><span>${s}</span></li>`).join('');
  const cupNote = isBlend && o.qty>1 ? ` · ${o.qty}잔 분량으로 자동 계산` : '';
  return `
    <div class="ingHead" style="margin-top:0;">
      <div class="sectionLabel" style="margin:0;">재료 (${o.size}${cupNote})</div>
      <button class="speakBtn" data-uid="${o.uid}">🔊 재료 읽어주기</button>
    </div>
    <table class="ing">${ingRows}</table>
    <div class="sectionLabel">제조 공정</div>
    <ul class="steps">${stepsLi}</ul>
    <div class="tierBadge ${tier.cls}">${tier.label}</div>
  `;
}

  const isOpen = orderExpandUid==o.uid;
  const sizeLine = isDone ? `${o.size} · ${o.qty}잔` : `${o.size} 사이즈`;
  return `
    <div class="compactCard ${isDone?'done':''}" style="border-color:${col};">
      ${rank!=null ? `<div class="rank" style="background:${col};">${rank}</div>` : ''}
      <div class="cc-top oc-clickable" data-open="${o.uid}">
        ${thumb(o.menuItem, 34)}
        <div style="min-width:0;">
          <div class="cc-name">${o.name}</div>
          <div class="cc-meta"><span style="color:${col};font-weight:700;">${o.cat}</span> · ${sizeLine} ${isOpen?'▲':'▼'}</div>
        </div>
      </div>
      ${isDone ? '' : `
      <div class="cc-qty">
        <button class="qty-btn minus" data-uid="${o.uid}">－</button>
        <span class="qty-num">${o.qty}잔</span>
        <button class="qty-btn plus" data-uid="${o.uid}">＋</button>
      </div>`}
      <div class="cc-actions">
        <button class="done-btn ${isDone?'undo':''}" data-uid="${o.uid}">${isDone?'되돌리기':'✓ 완료'}</button>
        <button class="del-btn" data-uid="${o.uid}">✕</button>

}

function renderOrder(){
  stopSpeaking();
  if(order.length===0){
    opBody.innerHTML = `<div class="queueEmpty">담긴 음료가 없어요.<br>메뉴에서 ＋ 버튼을 눌러 주문을 담아보세요.</div>`;
    return;
  }
  const pending = order.filter(o=>!o.done);
  const done = order.filter(o=>o.done);
  const sorted = suggestOrder(pending);

  const reasonText = t => t.tier===1 ? '오래 걸리는 블렌더/빙삭 작업 — 지금 바로 시작해야 다른 음료와 완성 타이밍이 맞아요.'
                        : t.tier===2 ? '스팀우유·우려내기가 필요해 시간이 걸려요 — 두 번째로 착수하세요.'
                        : '붓고 담는 단순 조합이라 가장 빨라요 — 마지막에 착수해도 늦지 않아요.';

  function renderRows(list, isDone){
    let out = '';
    for(let i=0; i<list.length; i+=2){
      const pair = list.slice(i, i+2);
      out += `<div class="orderRow">${pair.map((o,j)=> compactCard(o, isDone? null : i+j+1, catColor(o.cat), isDone)).join('')}</div>`;
      pair.forEach(o=>{
        if(orderExpandUid==o.uid){
          const col = catColor(o.cat);
          out += `<div class="detailPanel" style="margin-top:0;">
            ${isDone? '' : `<div class="oc-reason" style="margin-bottom:10px;">${reasonText(o.tier)}</div>`}
            ${buildOrderDetail(o, col)}
          </div>`;
        }
      });
    }
    return out;
  }

  let html = renderRows(sorted, false);

  if(done.length){
    html += `<div class="sectionLabel" style="margin-top:22px;">완료됨</div>`;
    html += renderRows(done, true);
  }

  html += `<div class="guideNote"><b>착수 순서 로직</b> · 여러 음료가 동시에 들어오면, 시간이 오래 걸리는 작업(블렌더·빙삭)부터 시작하고, 스팀우유 작업을 다음으로, 붓기만 하면 되는 단순 음료를 가장 나중에 시작하면 모든 음료가 비슷한 시점에 완성돼요. 카드를 탭하면 바로 아래에 제조법이 펼쳐져요.</div>`;

  opBody.innerHTML = html;

  opBody.querySelectorAll('.oc-clickable').forEach(el=>{
    el.onclick = ()=>{
      orderExpandUid = (orderExpandUid===el.dataset.open) ? null : el.dataset.open;
      renderOrder();
    };
  });
  opBody.querySelectorAll('.speakBtn').forEach(b=>{
    b.onclick = (e)=>{
      e.stopPropagation();
      const o = order.find(x=>x.uid==b.dataset.uid);
      if(!o) return;
      const item = o.menuItem;
      const isBlend = classify(item).tier===1;
      const cup = isBlend ? o.qty : 1;
      toggleSpeak(b, item, o.size, cup, isBlend);
    };
  });
  opBody.querySelectorAll('.done-btn').forEach(b=>{
    b.onclick = ()=>{
      const o = order.find(x=>x.uid==b.dataset.uid);
      o.done = !o.done;
      updateFab(); renderOrder();
    };
  });
  opBody.querySelectorAll('.del-btn').forEach(b=>{
    b.onclick = ()=>{
      order = order.filter(x=>x.uid!=b.dataset.uid);
      updateFab(); renderOrder();
    };
  });
  opBody.querySelectorAll('.qty-btn.plus').forEach(b=>{
    b.onclick = ()=>{
      const o = order.find(x=>x.uid==b.dataset.uid);
      o.qty += 1;
      updateFab(); renderOrder();
    };
  });
  opBody.querySelectorAll('.qty-btn.minus').forEach(b=>{
    b.onclick = ()=>{
      const o = order.find(x=>x.uid==b.dataset.uid);
      o.qty -= 1;
      if(o.qty<=0){ order = order.filter(x=>x.uid!==o.uid); }
      updateFab(); renderOrder();
    };
  });
}

/* ===================== POS 사진 인식 ===================== */
// 이름 정규화 — HOT/ICED, ice 접두사, [T]같은 태그, 공백을 제거해 기본 음료명만 비교
function normBase(s){
  return String(s)
    .replace(/\[[^\]]*\]/g,'')
    .replace(/\(HOT\)|\(ICED\)/gi,'')
    .replace(/아이스\s*/g,'')
    .replace(/^\s*ice/i,'')
    .replace(/[RLM]\s*$/i,'')
    .replace(/[\s()·・\-]/g,'')
    .toLowerCase();
}
function isIcedName(s){ return /아이스|iced|\bice/i.test(String(s)); }
// 화면 표기는 보통 이름 끝에 사이즈 알파벳이 공백 없이 붙음 (예: "아메리카노R", "카페라떼L")
function extractSize(raw){
  const m = String(raw).match(/([RLM])\s*$/i);
  return m ? m[1].toUpperCase() : null;
}

function matchMenuItem(rawName){
  if(!rawName) return null;
  const target = normBase(rawName);
  if(!target) return null;
  const iced = isIcedName(rawName);
  // 1) 정확히 일치
  const keysOf = item=> [item.n].concat(item.alias||[]).map(normBase);
  let candidates = MENU.filter(item=> keysOf(item).includes(target));
  // 2) 화면 표기가 정식명칭의 축약형인 경우만 허용 (예: "아메리카노"→"카페 아메리카노")
  //    반대 방향(화면 표기가 더 긴 경우, 예: "레몬카페라떼"⊃"카페라떼")은 다른 음료로 오매칭될 위험이 커서 제외
  if(candidates.length===0){
    candidates = MENU.filter(item=>{
      const base = normBase(item.n);
      return base.length>target.length && base.includes(target);
    }).sort((a,b)=> normBase(a.n).length - normBase(b.n).length);
  }
  // 3) 코드(약어)로도 매칭 시도 — 원본에 코드가 포함돼 있으면 가산점
  if(candidates.length===0){
    candidates = MENU.filter(item=> item.c && item.c.length>=2 && new RegExp('\\b'+item.c+'\\b','i').test(rawName));
  }
  if(candidates.length===0) return null;
  if(candidates.length===1) return candidates[0];
  const matchIced = candidates.find(it=> isIcedName(it.n)===iced);
  return matchIced || candidates[0];
}

const scanBtn = document.getElementById('scanBtn');
const scanInput = document.getElementById('scanInput');
const scanStatus = document.getElementById('scanStatus');

scanBtn.onclick = ()=> scanInput.click();

scanInput.onchange = async ()=>{
  const file = scanInput.files[0];
  if(!file) return;
  scanStatus.style.display = 'block';
  scanStatus.innerHTML = `<div class="scanTitle">📷 사진 인식 중…</div>사진 속 주문 화면을 읽고 있어요. 잠시만 기다려 주세요.`;
  try{
    const dataUrl = await fileToDataUrl(file);
    const mediaType = dataUrl.substring(5, dataUrl.indexOf(';'));
    const base64 = dataUrl.split(',')[1];

    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{
          role: "user",
          content: [
            { type: "image", source: { type: "base64", media_type: mediaType, data: base64 } },
            { type: "text", text: "이 이미지는 투썸플레이스 주방 KDS(주문내역 화면)입니다. 화면에는 여러 개의 주문 카드(티켓)가 격자로 배열되어 있고, 카드마다 주문번호·시간과 함께 여러 개의 품목이 줄줄이 나열되며 각 줄 오른쪽에 수량 숫자가 있습니다. 품목명은 보통 'ice아메리카노R', '카페 라떼R', 'ice카라멜 마키아또L' 처럼 'ice' 또는 '아이스' + 메뉴명 + 사이즈(R/L/M)가 공백 없이 붙어 표기됩니다. 화면에 보이는 모든 주문 카드의 모든 품목을 빠짐없이 읽어주세요. 음료가 아닌 푸드/디저트 품목(티라미수 등)도 이름 그대로 포함하세요. 오직 아래 JSON 배열 형식으로만 답하고, 다른 설명이나 코드블록 표시는 절대 포함하지 마세요:\n[{\"name\":\"화면에 표시된 품목명 그대로(사이즈 포함)\",\"qty\":수량}]" }
          ]
        }]
      })
    });
    const data = await response.json();
    const textBlock = (data.content||[]).map(b=>b.text||'').join('').trim();
    const clean = textBlock.replace(/```json|```/g,'').trim();
    let recognized;
    try{ recognized = JSON.parse(clean); }
    catch(e){ throw new Error('인식 결과를 읽지 못했어요'); }
    if(!Array.isArray(recognized) || recognized.length===0){
      scanStatus.innerHTML = `<div class="scanTitle">😕 인식된 주문이 없어요</div>사진이 흐릿하거나 화면이 잘 안 보일 수 있어요. 다시 찍어 주세요.<button class="scanClose" id="scanCloseBtn">닫기</button>`;
      wireScanClose();
      return;
    }

    const matchedLines = [], missedLines = [];
    recognized.forEach(r=>{
      const qty = Math.max(1, parseInt(r.qty)||1);
      const item = matchMenuItem(r.name);
      if(item){
        const wantSize = extractSize(r.name);
        const size = (wantSize && item.sizes.includes(wantSize)) ? wantSize : item.sizes[0];
        addToOrder(item, size, qty);
        matchedLines.push(`<li><span class="ok">✓</span> ${r.name} → <b>${item.n}</b> · ${size} · ${qty}잔</li>`);
      } else {
        missedLines.push(`<li><span class="miss">✕</span> ${r.name} (${qty}잔) — 메뉴에서 못 찾았어요, 직접 담아주세요</li>`);
      }
    });

    scanStatus.innerHTML = `
      <div class="scanTitle">📷 인식 결과 — ${recognized.length}개 중 ${matchedLines.length}개 자동으로 담김</div>
      <ul>${matchedLines.join('')}${missedLines.join('')}</ul>
      <button class="scanClose" id="scanCloseBtn">확인</button>
    `;
    wireScanClose();
    if(matchedLines.length>0) openOrderPanel();
  } catch(err){
    scanStatus.innerHTML = `<div class="scanTitle">⚠️ 인식에 실패했어요</div>${err.message||'네트워크 오류가 발생했어요.'}<br><span style="font-size:0.78rem;color:var(--ink-2);">이 기능은 Claude 앱/claude.ai 안에서 열었을 때만 동작해요. Vercel 등 외부 배포본에서는 별도 서버 연동이 필요합니다.</span><button class="scanClose" id="scanCloseBtn">닫기</button>`;
    wireScanClose();
  } finally {
    scanInput.value = '';
  }
};

function wireScanClose(){
  const b = document.getElementById('scanCloseBtn');
  if(b) b.onclick = ()=>{ scanStatus.style.display='none'; scanStatus.innerHTML=''; };
}

function fileToDataUrl(file){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=> resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
</script>
