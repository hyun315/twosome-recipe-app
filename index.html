<!DOCTYPE html>
<html lang="ko" class="locked">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>투썸 레시피 · 제조 순서 도우미</title>
<style>
  :root{
    /* 짙은 요소(헤더·바텀시트) 전용 */
    --dark:#241408;
    --dark-2:#3a2210;
    /* 본문은 항상 밝은 배경 + 진한 글씨 = 어떤 환경에서도 대비가 보장됨 */
    --paper:#fffdf9;
    --paper-2:#f4ead9;
    --ink:#241408;
    --ink-2:#5c4632;
    --white:#ffffff;
    --caramel:#c9700a;
    --caramel-strong:#a85800;
    --mint:#1f9e52;
    --danger:#d43b1f;
    --line: rgba(36,20,8,0.14);
    --line-dark: rgba(255,255,255,0.18);
    font-size:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    -webkit-tap-highlight-color: transparent;
    padding-bottom: 100px;
  }
  /* header (짙은 배경 — 브랜드 포인트) */
  header{
    position: sticky; top:0; z-index: 40;
    background: var(--dark);
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--line-dark);
  }

  /* 비밀번호 잠금 */
  html.locked body > *:not(#lock){ display:none !important; }
  #lock{ display:none; position:fixed; inset:0; z-index:9999; background:var(--dark); align-items:center; justify-content:center; padding:24px; }
  html.locked #lock{ display:flex; }
  .pwBox{ width:100%; max-width:340px; background:var(--paper); color:var(--ink); border-radius:16px; padding:22px 20px; box-shadow:0 10px 40px rgba(0,0,0,.4); }
  .pwBox h2{ margin:0 0 4px; font-size:1.1rem; }
  .pwBox p{ margin:0 0 12px; font-size:0.8rem; color:var(--ink-2); line-height:1.4; }
  .pwBox label{ display:block; font-size:0.74rem; font-weight:700; color:var(--ink-2); margin:10px 0 4px; }
  .pwBox input{ width:100%; box-sizing:border-box; padding:11px 12px; font-size:1rem; border:1.5px solid var(--ink-2); border-radius:10px; background:#fff; color:var(--ink); }
  .pwBox .pwBtn{ width:100%; margin-top:14px; padding:12px; border:none; border-radius:10px; background:var(--dark); color:#fff; font-weight:800; font-size:0.95rem; }
  .pwBox .pwBtn.sub{ background:#fff; color:var(--danger); border:1.5px solid var(--danger); margin-top:8px; }
  .pwBox .pwBtn.cancel{ background:transparent; color:var(--ink-2); margin-top:4px; font-weight:600; }
  .pwErr{ color:var(--danger); font-size:0.8rem; font-weight:700; min-height:1.1em; margin-top:8px; }
  .lockBtn{ margin-left:auto; background:transparent; border:1px solid rgba(255,255,255,.35); color:#fff; border-radius:8px; padding:3px 9px; font-size:0.8rem; }
  #pwDlg{ display:none; position:fixed; inset:0; z-index:9000; background:rgba(0,0,0,.55); align-items:center; justify-content:center; padding:24px; }
  #pwDlg.open{ display:flex; }
  .brand{ display:flex; align-items:baseline; gap:8px; margin-bottom:10px; }
  .brand .mark{
    font-family: Georgia, "Noto Serif KR", serif;
    font-size: 1.05rem; letter-spacing: 0.06em; color: #ffb457;
    border: 1px solid #ffb457; border-radius: 3px; padding: 1px 6px;
  }
  .brand h1{ font-size: 1.15rem; font-weight: 700; margin:0; color: #ffffff; letter-spacing: -0.01em; }
  .searchwrap{ position:relative; }
  #search{
    width:100%; padding: 12px 40px 12px 14px; border-radius: 12px;
    border: 1px solid var(--line-dark); background: var(--dark-2); color: #ffffff;
    font-size: 1rem; outline:none;
  }
  #search::placeholder{ color:#cbb9a3; }
  #search:focus{ border-color: #ffb457; }
  .searchwrap svg{ position:absolute; right:12px; top:50%; transform:translateY(-50%); color:#cbb9a3;}
  .tabs{ display:flex; gap:6px; margin-top:10px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex: 0 0 auto; padding:6px 12px; border-radius:999px; font-size:0.8rem;
    background: var(--dark-2); border:1px solid var(--line-dark); color: #e8dcc8;
    white-space:nowrap; cursor:pointer; font-weight:600;
  }
  .tab.active{ color: #ffffff; font-weight:800;}

  /* 본문: 밝은 배경 고정 */
  main{ padding: 14px 16px 40px; max-width: 720px; margin: 0 auto; background: var(--paper); }

  .empty{ text-align:center; color: var(--ink-2); padding: 60px 20px; font-size:0.9rem; background:var(--paper); }

  /* list */
  .item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding: 13px 4px; border-bottom: 1px solid var(--line); cursor:pointer;
    background: var(--paper); border-left: 4px solid transparent; padding-left: 10px;
  }
  .item .left{ flex:1; min-width:0; }
  .item .name{ font-size:1rem; font-weight:700; color: var(--ink); }
  .item .meta{ font-size:0.78rem; font-weight:700; margin-top:3px; }
  .item .sizes{ font-size:0.76rem; color: var(--ink-2); font-weight:500; margin-left:6px; }
  .addbtn{
    flex:0 0 auto; width:36px; height:36px; border-radius:50%;
    background: var(--paper-2); border:1px solid var(--line); color: var(--caramel-strong);
    font-size:1.3rem; font-weight:700; display:flex; align-items:center; justify-content:center;
  }
  .addbtn:active{ background: var(--caramel); color:#ffffff; border-color:var(--caramel); }

  /* 인라인 레시피 펼치기 패널 (목록/주문 카드 공용, 밝은 배경) */
  .detailPanel{
    background: var(--paper-2); border:1px solid var(--line); border-radius:14px;
    padding:14px 14px 16px; margin: 4px 4px 12px;
  }
  .sizeToggle{ display:flex; gap:6px; margin-bottom:12px; }
  .sizeToggle button{
    flex:1; padding:9px 0; border-radius:10px; border:1px solid var(--line);
    background: #ffffff; color:var(--ink); font-weight:700; font-size:0.85rem;
  }
  .cupStepper{ display:flex; align-items:center; justify-content:space-between; gap:10px; background:#ffffff; border:1px solid var(--line); border-radius:10px; padding:9px 12px; margin-bottom:10px; }
  .cupLabel{ font-size:0.82rem; font-weight:700; color:var(--ink); }
  .cupCtrl{ display:flex; align-items:center; gap:8px; flex:0 0 auto; }
  .sectionLabel{ font-size:0.78rem; color: var(--caramel-strong); font-weight:800; margin: 14px 0 6px; letter-spacing:0.03em; }
  table.ing{ width:100%; border-collapse:collapse; font-size:0.9rem; }
  table.ing td{ padding:8px 4px; border-bottom:1px solid var(--line); }
  table.ing td:first-child{ color:var(--ink); }
  table.ing td:last-child{ text-align:right; color:var(--ink-2); font-weight:700; }
  .steps{ margin:0; padding-left:0; list-style:none; }
  .steps li{ display:flex; gap:8px; padding:8px 0; font-size:0.92rem; line-height:1.5; border-bottom:1px dashed var(--line); color:var(--ink); }
  .steps li .n{ flex:0 0 20px; color:var(--caramel-strong); font-weight:800; }
  .tierBadge{ display:inline-block; margin-top:14px; padding:5px 12px; border-radius:999px; font-size:0.78rem; font-weight:800; }
  .tier1{ background: #ffb457; color:#241408; }
  .tier2{ background: #6ee08f; color:#0c2f18; }
  .tier3{ background: #e8dcc8; color:#241408; }
  .detailAdd{
    margin-top:16px; width:100%; padding:14px; border-radius:12px; border:none;
    color: #ffffff; font-weight:800; font-size:1rem;
  }
  .closeX{ position:absolute; top:14px; right:16px; background:none; border:none; color:#e8dcc8; font-size:1.3rem; }

  /* order fab + panel */
  .fab{
    position:fixed; right:16px; bottom:16px; z-index:50;
    background: var(--caramel); color:#ffffff; border-radius:999px;
    padding: 13px 18px; font-weight:800; font-size:0.95rem; box-shadow:0 6px 18px rgba(0,0,0,0.4);
    display:flex; align-items:center; gap:8px; border:none;
  }
  .fab .badge{ background: #ffffff; color:var(--caramel-strong); border-radius:999px; padding:1px 8px; font-size:0.8rem; font-weight:800; }
  .fab.hidden{ display:none; }

  .orderPanel{
    position:fixed; inset:0; z-index:70; background: var(--paper);
    transform: translateX(100%); transition: transform .22s ease; overflow-y:auto;
  }
  .orderPanel.open{ transform: translateX(0); }
  .opHeader{ position:sticky; top:0; background:var(--dark); padding:16px; border-bottom:1px solid var(--line-dark); display:flex; align-items:center; justify-content:space-between; z-index:2; color:#ffffff;}
  .opHeader h2{ margin:0; font-size:1.15rem; color:#ffffff; }
  .opBody{ padding: 14px 16px 120px; max-width:720px; margin:0 auto; background:var(--paper); }
  .queueEmpty{ text-align:center; padding:60px 20px; color:var(--ink-2); font-size:0.9rem; }


  /* 주문 1건 = 1칸 (티켓) */
  .orderRow{ flex-wrap:wrap; }
  .tkCard{ flex:1 1 300px; min-width:0; background:var(--paper-2); border:1.5px solid var(--ink-2); border-radius:13px; padding:8px 8px 6px; }
  .tkCard.done{ opacity:0.55; }
  .tkHead{ display:flex; align-items:baseline; gap:6px; flex-wrap:wrap; border-bottom:1.5px solid var(--line); padding-bottom:5px; margin-bottom:4px; }
  .tkNo{ font-weight:800; font-size:0.9rem; color:var(--ink); }
  .tkTime{ font-size:0.68rem; color:var(--ink-2); font-weight:600; }
  .tkTot{ margin-left:auto; font-size:0.7rem; font-weight:700; color:var(--ink-2); }
  .tkRow{ display:flex; align-items:center; gap:4px; padding:5px 0; border-bottom:1px dashed var(--line); }
  .tkRow:last-of-type{ border-bottom:none; }
  .tkRow.done .n{ text-decoration:line-through; opacity:0.6; }
  .tkMain{ display:flex; align-items:center; gap:5px; flex:1; min-width:0; cursor:pointer; }
  .tkMain .rk{ flex:0 0 auto; width:17px; height:17px; border-radius:50%; background:var(--caramel); color:#fff; font-size:0.62rem; font-weight:800; display:flex; align-items:center; justify-content:center; }
  .tkName{ min-width:0; }
  .tkName .n{ font-weight:800; font-size:0.78rem; color:var(--ink); line-height:1.2; word-break:keep-all; }
  .tkName .m{ font-size:0.64rem; font-weight:700; color:var(--ink-2); }
  .tkCtl{ display:flex; align-items:center; gap:2px; flex:0 0 auto; }
  .tkCtl .qty-btn{ width:22px; height:22px; border-radius:6px; font-size:0.8rem; padding:0; }
  .tkCtl .qty-num{ font-size:0.78rem; min-width:14px; text-align:center; font-weight:800; color:var(--ink); }
  .tkRow .done-btn, .tkRow .del-btn{ flex:0 0 auto; width:26px; height:26px; padding:0; border-radius:7px; border:1px solid var(--line); font-size:0.74rem; font-weight:800; }
  .tkRow .done-btn{ background:var(--mint); color:#fff; border-color:var(--mint); }
  .tkRow .done-btn.undo{ background:#fff; color:var(--ink-2); }
  .tkRow .del-btn{ background:var(--danger); color:#fff; border-color:var(--danger); }
  .tkMiss{ display:flex; align-items:center; gap:6px; padding:6px 7px; margin-top:4px; border-radius:8px; background:#fdeaea; border:1px solid var(--danger); font-size:0.74rem; color:var(--ink); }
  .tkMiss b{ color:var(--danger); }
  .tkMiss .x{ margin-left:auto; flex:0 0 auto; width:24px; height:24px; padding:0; border-radius:6px; border:1px solid var(--danger); background:#fff; color:var(--danger); font-weight:800; }
  .tkAll{ width:100%; margin-top:5px; padding:6px 0; border-radius:8px; border:1px solid var(--mint); background:#fff; color:var(--mint); font-weight:800; font-size:0.72rem; }

  .orderRow{ display:flex; gap:10px; margin-top:10px; align-items:stretch; }
  .compactCard{
    flex:1; min-width:0; background: var(--paper-2); border:1.5px solid var(--line); border-radius:13px;
    padding:10px; position:relative;
  }
  .compactCard .rank{
    position:absolute; left:-7px; top:-7px; width:22px; height:22px; border-radius:50%;
    background: var(--caramel); color:#ffffff; font-weight:800; font-size:0.72rem;
    display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,0.3);
  }
  .compactCard.done{ opacity:0.55; }
  .compactCard .cc-top{ display:flex; align-items:center; gap:8px; cursor:pointer; }
  .compactCard .cc-name{ font-weight:800; font-size:0.85rem; color:var(--ink); line-height:1.25;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .compactCard .cc-meta{ font-size:0.68rem; margin-top:2px; font-weight:600; color:var(--ink-2); }
  .compactCard .cc-qty{ display:flex; align-items:center; justify-content:space-between; margin-top:8px; }
  .compactCard .cc-qty .qty-btn{ width:26px; height:26px; border-radius:7px; font-size:0.9rem; padding:0; }
  .compactCard .cc-qty .qty-num{ font-size:0.8rem; min-width:auto; }
  .cc-actions{ display:flex; gap:6px; margin-top:8px; }
  .cc-actions button{ flex:1; padding:6px 0; border-radius:8px; border:1px solid var(--line); background:#ffffff; color:var(--ink); font-size:0.72rem; font-weight:700;}
  .cc-actions button.done-btn{ background: var(--mint); color:#ffffff; border-color:var(--mint); }
  .cc-actions button.done-btn.undo{ background: #ffffff; color:var(--ink-2); }
  .cc-actions button.del-btn{ background: var(--danger); color: #ffffff; border-color:var(--danger); flex:0 0 30px; }
  .oc-reason{ font-size:0.82rem; color:var(--ink-2); line-height:1.45; }

  .guideNote{ background: var(--paper-2); border:1px solid var(--line); border-radius:12px; padding:12px 14px; font-size:0.82rem; color:var(--ink-2); margin-top:14px; line-height:1.55;}
  .guideNote b{ color:var(--caramel-strong); }

  .clearAll{ font-size:0.8rem; color: #ffb457; background:none; border:none; font-weight:700; }

  /* customization ref */
  .refBtn{ width:100%; text-align:left; background:var(--paper-2); border:1px solid var(--line); color:var(--ink); font-weight:700; padding:12px 14px; border-radius:12px; font-size:0.85rem; margin: 6px 0 14px; }

  /* drink icon thumbnail */
  .thumb{
    flex:0 0 auto; border-radius:12px; background:#ffffff;
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
  }
  .thumb-dark{ background:#33200f; border-color: var(--line-dark); }

  /* qty stepper */
  .oc-qty{ display:flex; align-items:center; gap:10px; margin-top:10px; }
  .qty-btn{
    width:34px; height:34px; border-radius:9px; border:1px solid var(--line);
    background:#ffffff; color:var(--ink); font-size:1.1rem; font-weight:800; line-height:1;
  }
  .qty-btn:active{ background: var(--paper-2); }
  .qty-num{ font-weight:800; font-size:0.95rem; color:var(--ink); min-width:38px; text-align:center; }
  .oc-clickable{ cursor:pointer; }

  /* 재료 읽어주기(TTS) 버튼 */
  .ingHead{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:14px; }
  .ingHead .sectionLabel{ margin:0; }
  .speakBtn{
    flex:0 0 auto; padding:6px 12px; border-radius:999px; border:1px solid var(--line);
    background:#ffffff; color:var(--caramel-strong); font-weight:800; font-size:0.78rem;
  }
  .speakBtn.speaking{ background: var(--caramel-strong); color:#ffffff; border-color:var(--caramel-strong); }

  /* POS 사진 인식 */
  #scanStatus{ background:var(--paper-2); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin: 6px 0 14px; font-size:0.85rem; color:var(--ink); }
  #scanStatus .scanTitle{ font-weight:800; margin-bottom:6px; }
  #scanStatus ul{ margin:6px 0 0; padding-left:18px; }
  #scanStatus li{ margin:3px 0; }
  #scanStatus .ok{ color:#1c7a34; font-weight:700; }
  #scanStatus .miss{ color:var(--danger); font-weight:700; }
  #scanStatus .scanClose{ margin-top:10px; background:#fff; border:1px solid var(--line); border-radius:9px; padding:8px 12px; font-weight:700; font-size:0.82rem; }
</style>
</head>
<body>

<div id="lock"><div class="pwBox">
  <h2>🔒 비밀번호 입력</h2>
  <p>레시피 &amp; 제조 순서 도우미</p>
  <input id="lockInput" type="password" autocomplete="current-password" placeholder="비밀번호">
  <label style="display:flex;align-items:center;gap:8px;margin-top:10px;font-weight:600;"><input id="lockRemember" type="checkbox" style="width:auto;" checked> 이 기기에서 기억하기</label>
  <div class="pwErr" id="lockErr"></div>
  <button class="pwBtn" id="lockOk">열기</button>
</div></div>
<header>
  <div class="brand"><span class="mark">TS</span><h1>레시피 &amp; 제조 순서 도우미</h1><button class="lockBtn" id="lockBtn" title="비밀번호 설정">🔒</button></div>
  <div class="searchwrap">
    <input id="search" placeholder="음료 이름 또는 코드 검색 (예: 라떼, VL, 아인슈페너)" autocomplete="off">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
  </div>
  <div class="tabs" id="tabs"></div>
</header>

<main>
  <button class="refBtn" id="scanBtn" style="background:var(--dark); color:#fff; border-color:var(--dark); display:flex; align-items:center; justify-content:center; gap:8px; font-weight:800;">📷 POS 화면 사진으로 주문 인식</button>
  <input type="file" id="scanInput" accept="image/*" capture="environment" style="display:none;">
  <div id="scanStatus" style="display:none;"></div>
  <button class="refBtn" id="refToggle">⚙ 고객 요청사항(시럽·휘핑·우유변경·드리즐) 기준표 보기</button>
  <div id="refPanel" style="display:none;"></div>
  <div id="list"></div>
  <div class="empty" id="emptyMsg" style="display:none;">검색 결과가 없어요.</div>
</main>

<button class="fab" id="fab"><span>🧾 주문 목록</span><span class="badge" id="fabCount">0</span></button>

<div class="orderPanel" id="orderPanel">
  <div class="opHeader">
    <h2>🧾 현재 주문 · 제조 순서</h2>
    <div style="display:flex; gap:14px; align-items:center;">
      <button class="clearAll" id="clearAll">전체 비우기</button>
      <button class="closeX" id="opClose" style="position:static;">✕</button>
    </div>
  </div>
  <div class="opBody" id="opBody"></div>
</div>

<script id="appcode" type="text/plain">
/* ===================== DATA ===================== */
// tier 는 화면에서 steps 텍스트로 자동 분류하므로 여기선 재료/공정만 담는다.
/* MENU는 비밀번호 입력 후 주입됩니다 */
const CUSTOM_OPTIONS = [
["시럽(바닐라/헤이즐넛/카라멜)","HOT R:3 L:4 · ICED R:3 L:4 M:5 (pump)"],
["휘핑크림","HOT 30g · ICED R:25 L:30 M:30 (g)"],
["우유 변경(무지방/저지방/락토프리/두유/오틀리)","기존 우유와 동량으로 교체"],
["카라멜 드리즐","10g (카라멜 마키아또와 동일)"],
["초콜릿 드리즐","5g (카라멜 마키아또에서 가장자리 원형 2회 제외)"],
];

/* ===================== STATE ===================== */
let order = []; // {uid, name, code, size, ing, steps}
let activeCat = "전체";
let expandKey = null;   // 목록에서 펼쳐진 항목 키
let expandSize = null;
let expandCup = 1;
let missedItems = []; // 메뉴에서 못 찾은 주문 줄 {uid,ticket,tTime,name,qty}
let orderExpandUid = null; // 주문 카드에서 펼쳐진 항목 uid

const CATS = ["전체", ...Array.from(new Set(MENU.map(m=>m.cat)))];

// 카테고리별 고유 색상
// BRIGHT: 어두운 배경(헤더 탭·상세 시트) 위에서 쓰는 밝고 선명한 톤 — 짙은 글씨와 짝
// DARK  : 밝은 배경(본문 목록·주문 카드) 위에서 쓰는 진하고 채도 높은 톤 — 흰 배경에서도 또렷하게 읽힘
const CAT_COLORS_BRIGHT = {
  "커피":       "#ff9f2e",
  "콜드브루":   "#5cb8ff",
  "티":         "#5fe075",
  "블렌디드":   "#ff6fa0",
  "에이드":     "#2be0cd",
  "드링크":     "#c08bff",
  "전통음료":   "#ffd23f",
  "아이스크림": "#6cd2ff",
  "시즌":       "#ff6a5c",
};
const CAT_COLORS_DARK = {
  "커피":       "#a15a00",
  "콜드브루":   "#0f5f9e",
  "티":         "#1c7a34",
  "블렌디드":   "#ab2159",
  "에이드":     "#0a7a70",
  "드링크":     "#6428c7",
  "전통음료":   "#8f6a00",
  "아이스크림": "#0e6f96",
  "시즌":       "#c22c1c",
};
function catColorBright(cat){ return CAT_COLORS_BRIGHT[cat] || "#ff9f2e"; }
function catColorDark(cat){ return CAT_COLORS_DARK[cat] || "#a15a00"; }
// 하위 호환용 기본값(밝은 배경 텍스트 용도) — 기존 코드에서 catColor() 호출 시 진한 톤을 반환
function catColor(cat){ return catColorDark(cat); }

/* ===================== 음료 아이콘(간단 컵 일러스트) ===================== */
// 실제 매장 제품사진은 저작권·호스팅 문제가 있어, 카테고리색+HOT/ICED/블렌디드 형태를
// 살린 심플한 컵 아이콘을 즉석에서 그려서 보여줍니다.
function drinkType(item){
  const iced = /아이스|\(ICED\)/i.test(item.n);
  if(classify(item).tier===1) return 'blend';
  return iced ? 'iced' : 'hot';
}
function cupSVG(item, px){
  const col = catColorDark(item.cat);
  const type = drinkType(item);
  let inner = '';
  if(type==='hot'){
    inner = `
      <path d="M8 12h20v14a6 6 0 0 1-6 6H14a6 6 0 0 1-6-6V12z" fill="${col}"/>
      <path d="M28 15h3.2a4 4 0 0 1 0 8H28" fill="none" stroke="${col}" stroke-width="2.4"/>
      <path d="M12 6c1-2 3-2 3 0s2 2 3 0" stroke="${col}" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <path d="M19 6c1-2 3-2 3 0s2 2 3 0" stroke="${col}" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
  } else if(type==='iced'){
    inner = `
      <path d="M10 10h20l-2.2 24a3 3 0 0 1-3 2.8H15.2a3 3 0 0 1-3-2.8L10 10z" fill="${col}" opacity="0.88"/>
      <rect x="14" y="16" width="6" height="6" rx="1.2" fill="#ffffff" opacity="0.85" transform="rotate(-12 17 19)"/>
      <rect x="20" y="23" width="5" height="5" rx="1.2" fill="#ffffff" opacity="0.7" transform="rotate(10 22 25)"/>
      <line x1="25" y1="4" x2="27.5" y2="17" stroke="${col}" stroke-width="2.4" stroke-linecap="round"/>`;
  } else {
    inner = `
      <path d="M11 15h18l-1.6 19.5a3 3 0 0 1-3 2.7H15.6a3 3 0 0 1-3-2.7L11 15z" fill="${col}"/>
      <ellipse cx="20" cy="15" rx="9" ry="3" fill="${col}"/>
      <ellipse cx="20" cy="13.4" rx="6.6" ry="2" fill="#ffffff" opacity="0.9"/>
      <line x1="22" y1="4" x2="23.5" y2="16" stroke="${col}" stroke-width="2.4" stroke-linecap="round"/>`;
  }
  return `<svg width="${px}" height="${px}" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
}
function thumb(item, boxPx, dark){
  if(item.img){
    return `<div class="thumb ${dark?'thumb-dark':''}" style="width:${boxPx}px;height:${boxPx}px;overflow:hidden;padding:0;"><img src="${item.img}" style="width:100%;height:100%;object-fit:cover;" loading="lazy" alt=""></div>`;
  }
  return `<div class="thumb ${dark?'thumb-dark':''}" style="width:${boxPx}px;height:${boxPx}px;">${cupSVG(item, Math.round(boxPx*0.72))}</div>`;
}

const listEl = document.getElementById('list');

function matches(item, q){
  if(!q) return true;
  q = q.trim().toLowerCase();
  return item.n.toLowerCase().includes(q) || (item.c||'').toLowerCase().includes(q);
}

function keyOf(item){ return item.n+'__'+item.c; }

function classify(item){
  const t = item.steps.join(' ');
  if(/블렌더|빙삭/.test(t)) return {tier:1, cls:'tier1', label:'🧃 블렌더/빙삭 — 먼저 착수'};
  if(/스팀|우리기|4분/.test(t)) return {tier:2, cls:'tier2', label:'♨️ 스팀·우려내기 — 중간 착수'};
  return {tier:3, cls:'tier3', label:'⚡ 단순 조합 — 나중에 착수'};
}

// 블렌디드(블렌더/빙삭) 음료의 잔 수 배율 계산 — 숫자·"숫자(메모)" 형태 모두 처리
function trimNum(n){
  const r = Math.round(n*100)/100;
  return String(r);
}
function scaleVal(val, mult){
  if(!mult || mult===1) return val;
  if(typeof val === 'number') return trimNum(val*mult);
  if(typeof val === 'string'){
    const m = val.match(/^(\d+(?:\.\d+)?)/);
    if(m){ return trimNum(parseFloat(m[1])*mult); }
  }
  return val;
}
function ingRowsHTML(item, size, cup, isBlend){
  return item.ing.map(row=>{
    let val = row[size];
    if(val===undefined || val===null) return '';
    if(isBlend && cup && cup!==1) val = scaleVal(val, cup);
    return `<tr><td>${row.m}</td><td>${val} ${row.u||''}</td></tr>`;
  }).join('');
}

/* ===================== 재료 음성으로 읽어주기 (TTS) ===================== */
// 손이 바쁠 때 화면을 안 보고도 재료만 짧게, 계속 반복해서 들을 수 있게
const speakState = { active:false, timer:null };

// 샷/펌프는 바리스타 용어인 "원샷·투샷·쓰리샷" 식으로 읽고, 나머지 단위는 한글 단위명으로 읽는다.
const SHOT_PUMP_WORDS = {1:'원',2:'투',3:'쓰리',4:'포',5:'파이브',6:'식스',7:'세븐',8:'에잇',9:'나인',10:'텐'};
const UNIT_WORDS = { g:'그램', kg:'킬로그램', ml:'밀리리터', l:'리터', ea:'개', cm:'센티미터', pinch:'꼬집', tsp:'티스푼', tbsp:'큰술', cup:'컵', fl_oz:'플루이드온스', oz:'온스', lb:'파운드' };

function numOnly(val){
  const s = String(val);
  const m = s.match(/^(\d+(?:\.\d+)?)/);
  if(m) return m[1];
  return s.replace(/\([^)]*\)/g,'').trim();
}
function speakUnitPhrase(numStr, unit){
  const n = parseFloat(numStr);
  if(unit==='shot') return (SHOT_PUMP_WORDS[n] || numStr) + '샷';
  if(unit==='pump') return (SHOT_PUMP_WORDS[n] || numStr) + '펌프';
  if(!unit) return numStr;
  return numStr + (UNIT_WORDS[unit] || unit);
}
function ingLines(item, size, cup, isBlend){
  return item.ing.map(row=>{
    let val = row[size];
    if(val===undefined || val===null) return null;
    if(isBlend && cup && cup!==1) val = scaleVal(val, cup);
    const numStr = numOnly(val);
    const name = String(row.m).replace(/\([^)]*\)/g,'').trim();
    return `${name} ${speakUnitPhrase(numStr, row.u)}`;
  }).filter(Boolean);
}
function stopSpeaking(){
  speakState.active = false;
  if(speakState.timer){ clearTimeout(speakState.timer); speakState.timer = null; }
  if(window.speechSynthesis) speechSynthesis.cancel();
  document.querySelectorAll('.speakBtn').forEach(b=>{ b.textContent = '🔊 재료 읽어주기'; b.classList.remove('speaking'); });
}
function toggleSpeak(btnEl, item, size, cup, isBlend){
  if(speakState.active){ stopSpeaking(); return; }
  if(!window.speechSynthesis){ alert('이 브라우저는 음성 읽기를 지원하지 않아요.'); return; }
  stopSpeaking();
  speakState.active = true;
  btnEl.textContent = '⏹ 읽기 중지';
  btnEl.classList.add('speaking');
  const lines = ingLines(item, size, cup, isBlend);
  if(lines.length===0){ stopSpeaking(); return; }
  function speakOne(idx){
    if(!speakState.active) return;
    if(idx>=lines.length){
      speakState.timer = setTimeout(()=> speakOne(0), 1000);
      return;
    }
    const utter = new SpeechSynthesisUtterance(lines[idx]);
    utter.lang = 'ko-KR';
    utter.rate = 0.98;
    utter.onend = ()=>{ if(speakState.active) speakOne(idx+1); };
    utter.onerror = ()=>{ if(speakState.active) speakOne(idx+1); };
    speechSynthesis.speak(utter);
  }
  speakOne(0);
}

/* ===================== ORDER QUEUE ===================== */
function addToOrder(item, size, qty, ticket, tTime){
  qty = qty || 1;
  ticket = ticket || null;
  const existing = order.find(o=> !o.done && o.name===item.n && o.size===size && (o.ticket||null)===ticket);
  let entry = existing;
  if(existing){
    existing.qty += qty;
  } else {
    entry = {
      uid: Date.now()+Math.random(),
      name: item.n, code: item.c, cat: item.cat, size, ticket, tTime: tTime||'',
      steps: item.steps, done:false, qty,
      menuItem: item,
      tier: classify(item)
    };
    order.push(entry);
  }
  updateFab();
  return entry;
}
function updateFab(){
  const cnt = order.filter(o=>!o.done).reduce((s,o)=>s+o.qty,0);
  document.getElementById('fabCount').textContent = cnt;
  document.getElementById('fab').classList.toggle('hidden', order.length===0 && missedItems.length===0);
}

function suggestOrder(list){
  // tier1(블렌더/빙삭) 우선 → tier2(스팀) → tier3(단순), 동일 tier 내에서는 공정 단계 수 많은 순
  return [...list].sort((a,b)=>{
    if(a.tier.tier !== b.tier.tier) return a.tier.tier - b.tier.tier;
    return b.steps.length - a.steps.length;
  });
}

function buildOrderDetail(o, col){
  const item = o.menuItem;
  const tier = classify(item);
  const isBlend = tier.tier===1;
  const cup = isBlend ? o.qty : 1;
  const ingRows = ingRowsHTML(item, o.size, cup, isBlend);
  const stepsLi = item.steps.map((s,i)=>`<li><span class="n">${i+1}</span><span>${s}</span></li>`).join('');
  const cupNote = isBlend && o.qty>1 ? ` · ${o.qty}잔 분량으로 자동 계산` : '';
  return `
    <div class="ingHead" style="margin-top:0;">
      <div class="sectionLabel" style="margin:0;">재료 (${o.size}${cupNote})</div>
      <button class="speakBtn" data-uid="${o.uid}">🔊 재료 읽어주기</button>
    </div>
    <table class="ing">${ingRows}</table>
    <div class="sectionLabel">제조 공정</div>
    <ul class="steps">${stepsLi}</ul>
    <div class="tierBadge ${tier.cls}">${tier.label}</div>
  `;
}

function renderTickets(){
  const groups = {};
  order.forEach(o=>{
    const k = o.ticket || '__manual';
    (groups[k] = groups[k] || {key:k, time:o.tTime||'', items:[], missed:[]}).items.push(o);
  });
  missedItems.forEach(m=>{
    const k = m.ticket || '__manual';
    (groups[k] = groups[k] || {key:k, time:m.tTime||'', items:[], missed:[]}).missed.push(m);
  });
  const list = Object.values(groups);
  const allDone = g=> g.items.length>0 && g.items.every(o=>o.done);
  const cmp = (a,b)=> ((a.key==='__manual')-(b.key==='__manual')) || String(a.time).localeCompare(String(b.time)) || a.key.localeCompare(b.key);
  const act = list.filter(g=>!allDone(g)).sort(cmp);
  const dn = list.filter(allDone).sort(cmp);
  const reasonText = t => t.tier===1 ? '오래 걸리는 블렌더/빙삭 작업 — 가장 먼저 시작하세요.' : t.tier===2 ? '스팀우유·우려내기가 필요해요 — 두 번째로 착수하세요.' : '붓고 담는 단순 조합 — 마지막에 착수해도 늦지 않아요.';

  function card(g){
    const pend = suggestOrder(g.items.filter(o=>!o.done));
    const dn2 = g.items.filter(o=>o.done);
    const total = g.items.reduce((s,o)=>s+o.qty,0) + g.missed.reduce((s,m)=>s+m.qty,0);
    const label = g.key==='__manual' ? '직접 담은 음료' : '주문 '+g.key;
    const rows = pend.map((o,i)=>tkRow(o,i+1)).concat(dn2.map(o=>tkRow(o,null))).join('');
    const doneAll = allDone(g);
    return `<div class="tkCard ${doneAll?'done':''}">
      <div class="tkHead"><span class="tkNo">${label}</span><span class="tkTime">${g.time||''}</span><span class="tkTot">총 ${total}잔</span></div>
      ${rows}
      ${g.missed.map(m=>`<div class="tkMiss"><span>⚠️ <b>${m.name}</b> ×${m.qty} — 메뉴에 없음(음료가 아니거나 레시피 미등록)</span><button class="x" data-mid="${m.uid}">✕</button></div>`).join('')}
      ${doneAll || !g.items.length ? '' : `<button class="tkAll" data-tk="${g.key}">이 주문 전체 완료</button>`}
    </div>`;
  }
  function tkRow(o, rank){
    const col = catColor(o.cat);
    const open = orderExpandUid==o.uid;
    return `<div class="tkRow ${o.done?'done':''}">
      <div class="tkMain oc-clickable" data-open="${o.uid}">
        ${rank?`<span class="rk">${rank}</span>`:''}
        ${thumb(o.menuItem, 28)}
        <div class="tkName"><div class="n">${o.name}</div><div class="m"><span style="color:${col}">${o.size}</span> ${open?'▲':'▼'}</div></div>
      </div>
      <div class="tkCtl"><button class="qty-btn minus" data-uid="${o.uid}">－</button><span class="qty-num">${o.qty}</span><button class="qty-btn plus" data-uid="${o.uid}">＋</button></div>
      <button class="done-btn ${o.done?'undo':''}" data-uid="${o.uid}">${o.done?'↺':'✓'}</button>
      <button class="del-btn" data-uid="${o.uid}">✕</button>
    </div>`;
  }
  function rows(gs){
    let out='';
    for(let i=0;i<gs.length;i+=2){
      const pair = gs.slice(i,i+2);
      out += `<div class="orderRow">${pair.map(card).join('')}${pair.length<2?'<div style="flex:1 1 300px;height:0"></div>':''}</div>`;
      pair.forEach(g=>g.items.forEach(o=>{
        if(orderExpandUid==o.uid){
          out += `<div class="detailPanel" style="margin-top:0;">
            <div class="oc-reason" style="margin-bottom:6px;font-weight:800;">${o.name} ${o.size} · ${o.qty}잔 ${g.key==='__manual'?'':'· 주문 '+g.key}</div>
            ${o.done?'':`<div class="oc-reason" style="margin-bottom:10px;">${reasonText(o.tier)}</div>`}
            ${buildOrderDetail(o, catColor(o.cat))}
          </div>`;
        }
      }));
    }
    return out;
  }
  let html = rows(act);
  if(dn.length) html += `<div class="sectionLabel" style="margin-top:22px;">완료된 주문</div>` + rows(dn);
  html += `<div class="guideNote"><b>한 칸 = 한 주문</b> · 칸 안의 번호는 그 주문 안에서 착수할 순서예요(블렌더 → 스팀 → 단순). 음료 이름을 탭하면 바로 아래에 제조법이 펼쳐져요.</div>`;
  return html;
}

function renderOrder(){
  stopSpeaking();
  if(order.length===0 && missedItems.length===0){
    opBody.innerHTML = `<div class="queueEmpty">담긴 음료가 없어요.<br>메뉴에서 ＋ 버튼을 눌러 주문을 담아보세요.</div>`;
    return;
  }
  const pending = order.filter(o=>!o.done);
  const done = order.filter(o=>o.done);
  const sorted = suggestOrder(pending);

  const reasonText = t => t.tier===1 ? '오래 걸리는 블렌더/빙삭 작업 — 지금 바로 시작해야 다른 음료와 완성 타이밍이 맞아요.'
                        : t.tier===2 ? '스팀우유·우려내기가 필요해 시간이 걸려요 — 두 번째로 착수하세요.'
                        : '붓고 담는 단순 조합이라 가장 빨라요 — 마지막에 착수해도 늦지 않아요.';

  function renderRows(list, isDone){
    let out = '';
    for(let i=0; i<list.length; i+=2){
      const pair = list.slice(i, i+2);
      out += `<div class="orderRow">${pair.map((o,j)=> compactCard(o, isDone? null : i+j+1, catColor(o.cat), isDone)).join('')}</div>`;
      pair.forEach(o=>{
        if(orderExpandUid==o.uid){
          const col = catColor(o.cat);
          out += `<div class="detailPanel" style="margin-top:0;">
            ${isDone? '' : `<div class="oc-reason" style="margin-bottom:10px;">${reasonText(o.tier)}</div>`}
            ${buildOrderDetail(o, col)}
          </div>`;
        }
      });
    }
    return out;
  }

  const ticketMode = order.some(o=>o.ticket) || missedItems.some(m=>m.ticket);
  let html = ticketMode ? renderTickets() : renderRows(sorted, false);

  if(!ticketMode && done.length){
    html += `<div class="sectionLabel" style="margin-top:22px;">완료됨</div>`;
    html += renderRows(done, true);
  }

  if(!ticketMode) html += `<div class="guideNote"><b>착수 순서 로직</b> · 여러 음료가 동시에 들어오면, 시간이 오래 걸리는 작업(블렌더·빙삭)부터 시작하고, 스팀우유 작업을 다음으로, 붓기만 하면 되는 단순 음료를 가장 나중에 시작하면 모든 음료가 비슷한 시점에 완성돼요. 카드를 탭하면 바로 아래에 제조법이 펼쳐져요.</div>`;

  opBody.innerHTML = html;

  opBody.querySelectorAll('.oc-clickable').forEach(el=>{
    el.onclick = ()=>{
      orderExpandUid = (orderExpandUid===el.dataset.open) ? null : el.dataset.open;
      renderOrder();
    };
  });
  opBody.querySelectorAll('.speakBtn').forEach(b=>{
    b.onclick = (e)=>{
      e.stopPropagation();
      const o = order.find(x=>x.uid==b.dataset.uid);
      if(!o) return;
      const item = o.menuItem;
      const isBlend = classify(item).tier===1;
      const cup = isBlend ? o.qty : 1;
      toggleSpeak(b, item, o.size, cup, isBlend);
    };
  });
  opBody.querySelectorAll('.done-btn').forEach(b=>{
    b.onclick = ()=>{
      const o = order.find(x=>x.uid==b.dataset.uid);
      o.done = !o.done;
      updateFab(); renderOrder();
    };
  });
  opBody.querySelectorAll('.del-btn').forEach(b=>{
    b.onclick = ()=>{
      order = order.filter(x=>x.uid!=b.dataset.uid);
      updateFab(); renderOrder();
    };
  });
  opBody.querySelectorAll('.tkMiss .x').forEach(b=>{
    b.onclick = ()=>{ missedItems = missedItems.filter(m=>m.uid!=b.dataset.mid); renderOrder(); };
  });
  opBody.querySelectorAll('.tkAll').forEach(b=>{
    b.onclick = ()=>{
      const k=b.dataset.tk;
      order.forEach(o=>{ if((o.ticket||'__manual')===k) o.done=true; });
      missedItems = missedItems.filter(m=>(m.ticket||'__manual')!==k);
      updateFab(); renderOrder();
    };
  });
  opBody.querySelectorAll('.qty-btn.plus').forEach(b=>{
    b.onclick = ()=>{
      const o = order.find(x=>x.uid==b.dataset.uid);
      o.qty += 1;
      updateFab(); renderOrder();
    };
  });
  opBody.querySelectorAll('.qty-btn.minus').forEach(b=>{
    b.onclick = ()=>{
      const o = order.find(x=>x.uid==b.dataset.uid);
      o.qty -= 1;
      if(o.qty<=0){ order = order.filter(x=>x.uid!==o.uid); }
      updateFab(); renderOrder();
    };
  });
}

/* ===================== POS 사진 인식 ===================== */
// 이름 정규화 — HOT/ICED, ice 접두사, [T]같은 태그, 공백을 제거해 기본 음료명만 비교
function normBase(s){
  return String(s)
    .replace(/\[[^\]]*\]/g,'')
    .replace(/\(HOT\)|\(ICED\)/gi,'')
    .replace(/아이스\s*/g,'')
    .replace(/^\s*ice/i,'')
    .replace(/[RLM]\s*$/i,'')
    .replace(/[\s()·・\-]/g,'')
    .toLowerCase();
}
function isIcedName(s){ return /아이스|iced|\bice/i.test(String(s)); }
// 화면 표기는 보통 이름 끝에 사이즈 알파벳이 공백 없이 붙음 (예: "아메리카노R", "카페라떼L")
function extractSize(raw){
  const m = String(raw).match(/([RLM])\s*$/i);
  return m ? m[1].toUpperCase() : null;
}

function matchMenuItem(rawName){
  if(!rawName) return null;
  const target = normBase(rawName);
  if(!target) return null;
  const iced = isIcedName(rawName);
  // 1) 정확히 일치
  const keysOf = item=> [item.n].concat(item.alias||[]).map(normBase);
  let candidates = MENU.filter(item=> keysOf(item).includes(target));
  // 2) 화면 표기가 정식명칭의 축약형인 경우만 허용 (예: "아메리카노"→"카페 아메리카노")
  //    반대 방향(화면 표기가 더 긴 경우, 예: "레몬카페라떼"⊃"카페라떼")은 다른 음료로 오매칭될 위험이 커서 제외
  if(candidates.length===0){
    candidates = MENU.filter(item=>{
      const base = normBase(item.n);
      return base.length>target.length && base.includes(target);
    }).sort((a,b)=> normBase(a.n).length - normBase(b.n).length);
  }
  // 3) 코드(약어)로도 매칭 시도 — 원본에 코드가 포함돼 있으면 가산점
  if(candidates.length===0){
    candidates = MENU.filter(item=> item.c && item.c.length>=2 && new RegExp('\\b'+item.c+'\\b','i').test(rawName));
  }
  if(candidates.length===0) return null;
  if(candidates.length===1) return candidates[0];
  const matchIced = candidates.find(it=> isIcedName(it.n)===iced);
  return matchIced || candidates[0];
}

const scanBtn = document.getElementById('scanBtn');
const scanInput = document.getElementById('scanInput');
const scanStatus = document.getElementById('scanStatus');

scanBtn.onclick = ()=> scanInput.click();

scanInput.onchange = async ()=>{
  const file = scanInput.files[0];
  if(!file) return;
  scanStatus.style.display = 'block';
  scanStatus.innerHTML = `<div class="scanTitle">📷 사진 인식 중…</div>사진 속 주문 화면을 읽고 있어요. 잠시만 기다려 주세요.`;
  try{
    const dataUrl = await resizeImageToDataUrl(file, 1600);
    const mediaType = 'image/jpeg';
    const base64 = dataUrl.split(',')[1];

    let data;
    // 1순위: 같은 사이트의 서버 함수(/api/scan) — Vercel 배포본에서 동작
    let proxyRes = null;
    try{
      proxyRes = await fetch('/api/scan', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ image: base64, mediaType })
      });
    }catch(e){ proxyRes = null; }
    if(proxyRes && proxyRes.ok){
      data = await proxyRes.json();
    } else if(proxyRes && proxyRes.status!==404 && proxyRes.status!==405){
      let msg=''; try{ msg=(await proxyRes.json()).error||''; }catch(e){}
      throw new Error(msg || ('서버 오류 ('+proxyRes.status+')'));
    } else {
      // 2순위: Claude 앱 안에서 열었을 때 직접 호출
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 3000,
          messages: [{ role: "user", content: [
            { type: "image", source: { type: "base64", media_type: mediaType, data: base64 } },
            { type: "text", text: SCAN_PROMPT }
          ]}]
        })
      });
      data = await response.json();
    }
    const textBlock = (data.content||[]).map(b=>b.text||'').join('').trim();
    const clean = textBlock.replace(/```json|```/g,'').trim();
    let recognized;
    try{ recognized = JSON.parse(clean); }
    catch(e){ throw new Error('인식 결과를 읽지 못했어요'); }
    if(!Array.isArray(recognized) || recognized.length===0){
      scanStatus.innerHTML = `<div class="scanTitle">😕 인식된 주문이 없어요</div>사진이 흐릿하거나 화면이 잘 안 보일 수 있어요. 다시 찍어 주세요.<button class="scanClose" id="scanCloseBtn">닫기</button>`;
      wireScanClose();
      return;
    }

    // 응답 형식: [{ticket,time,items:[{name,qty}]}] (구형 [{name,qty}]도 허용)
    const tickets = (recognized[0] && Array.isArray(recognized[0].items))
      ? recognized
      : [{ticket:null, time:'', items:recognized}];
    const existingTickets = new Set(order.filter(o=>o.ticket).map(o=>o.ticket).concat(missedItems.filter(m=>m.ticket).map(m=>m.ticket)));
    const blocks = [];
    let firstEntry = null, nMatched = 0, nTotal = 0, skipped = 0;
    tickets.forEach(t=>{
      const tk = t.ticket ? String(t.ticket).trim() : null;
      if(tk && existingTickets.has(tk)){ skipped++; return; }   // 이미 담긴 주문(같은 화면 재촬영)은 건너뜀
      const lines = [];
      (t.items||[]).forEach(r=>{
        nTotal++;
        const qty = Math.max(1, parseInt(r.qty)||1);
        const item = matchMenuItem(r.name);
        if(item){
          const wantSize = extractSize(r.name);
          const size = (wantSize && item.sizes.includes(wantSize)) ? wantSize : item.sizes[0];
          const entry = addToOrder(item, size, qty, tk, t.time||'');
          if(!firstEntry || String(entry.tTime||'~').localeCompare(String(firstEntry.tTime||'~'))<0) firstEntry = entry;
          nMatched++;
          lines.push(`<li><span class="ok">✓</span> ${r.name} → <b>${item.n}</b> · ${size} · ${qty}잔</li>`);
        } else {
          missedItems.push({uid:Date.now()+Math.random(), ticket:tk, tTime:t.time||'', name:r.name, qty});
          lines.push(`<li><span class="miss">✕</span> ${r.name} (${qty}) — 음료가 아니거나 메뉴에 없어요</li>`);
        }
      });
      blocks.push(`<div style="margin-top:6px;"><b>${tk?('주문 '+tk):'인식된 항목'}</b> ${t.time||''}<ul>${lines.join('')}</ul></div>`);
    });

    scanStatus.innerHTML = `
      <div class="scanTitle">📷 인식 결과 — 주문 ${blocks.length}건, 품목 ${nTotal}개 중 ${nMatched}개 자동으로 담김${skipped?` (이미 담긴 주문 ${skipped}건 건너뜀)`:''}</div>
      ${blocks.join('')}
      <button class="scanClose" id="scanCloseBtn">확인</button>
    `;
    wireScanClose();
    if(nMatched>0 || missedItems.length>0){
      if(firstEntry) orderExpandUid = firstEntry.uid; // 첫 메뉴 레시피를 바로 펼쳐서 보여줌
      openOrderPanel();
    }
  } catch(err){
    scanStatus.innerHTML = `<div class="scanTitle">⚠️ 인식에 실패했어요</div>${err.message||'네트워크 오류가 발생했어요.'}<br><span style="font-size:0.78rem;color:var(--ink-2);">Vercel 환경변수 ANTHROPIC_API_KEY가 설정돼 있는지 확인해 주세요.</span><button class="scanClose" id="scanCloseBtn">닫기</button>`;
    wireScanClose();
  } finally {
    scanInput.value = '';
  }
};

function wireScanClose(){
  const b = document.getElementById('scanCloseBtn');
  if(b) b.onclick = ()=>{ scanStatus.style.display='none'; scanStatus.innerHTML=''; };
}


const SCAN_PROMPT = "이 이미지는 투썸플레이스 주방 KDS(주문내역 화면) 사진입니다. 화면에는 주문 카드(티켓)가 격자로 배열되어 있고, 카드 한 칸이 주문 1건입니다. 카드 왼쪽 위에 주문번호(예: 01-0041, 02-0060), 그 아래 접수시각(예: 14:18:34)이 있고, 그 아래에 품목이 줄줄이 나열되며 각 줄 오른쪽에 수량 숫자가 있습니다. 품목명은 'ice아메리카노R', '바닐라 라떼R', 'ice아메리카노아로마R' 처럼 'ice'(아이스) + 메뉴명 + 사이즈(R/L/M)가 공백 없이 붙어 표기됩니다. 화면에 보이는 모든 카드를 빠짐없이 읽고, 각 카드의 품목을 그 카드 안에 묶어서 적으세요(노란색 강조 줄 포함, 화면 가장자리에 일부 잘린 카드·줄도 읽을 수 있는 만큼). 케이크·초 등 음료가 아닌 품목도 이름 그대로 포함하세요. 카드 상단의 '총N개' 숫자와 품목 수량 합이 맞는지 확인하세요. 오직 JSON 배열로만 답하고 다른 설명이나 코드블록 표시는 쓰지 마세요: [{\"ticket\":\"주문번호\",\"time\":\"HH:MM:SS\",\"items\":[{\"name\":\"화면 표기 그대로(ice·사이즈 포함)\",\"qty\":수량}]}]";

// 아이패드 사진은 용량이 커서 업로드 한도에 걸리므로 가로세로 최대 1600px JPEG로 줄임
function resizeImageToDataUrl(file, maxDim){
  return new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      const scale = Math.min(1, maxDim/Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); fileToDataUrl(file).then(resolve, reject); };
    img.src = url;
  });
}

function fileToDataUrl(file){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=> resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

(function(){
  const b64 = t => Uint8Array.from(atob(t), ch => ch.charCodeAt(0));
  const lsGet = k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } };
  const lsSet = (k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} };
  const lsDel = k=>{ try{ localStorage.removeItem(k); }catch(e){} };
  const input = document.getElementById('lockInput'), err = document.getElementById('lockErr');
  async function decrypt(pw){
    if(!(window.crypto && crypto.subtle)) throw new Error('nosubtle');
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    try{
      const buf = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.ct));
      return new TextDecoder().decode(buf);
    }catch(e){ return null; }
  }
  let started = false;
  function start(menuJson){
    if(started) return; started = true;
    const s = document.createElement('script');
    s.textContent = 'const MENU = ' + menuJson + ';\n' + document.getElementById('appcode').textContent;
    document.body.appendChild(s);
    document.documentElement.classList.remove('locked');
  }
  async function attempt(pw, remember){
    let json;
    try{ json = await decrypt(pw); }
    catch(e){ err.textContent = 'https 주소(배포 사이트)에서 열어주세요'; return false; }
    if(json===null){ err.textContent = '비밀번호가 맞지 않아요'; return false; }
    if(remember){ lsSet('tsAppPw', pw); }
    try{ sessionStorage.setItem('tsAppPw', pw); }catch(e){}
    err.textContent=''; input.value=''; start(json); return true;
  }
  document.getElementById('lockOk').onclick = ()=> attempt(input.value, document.getElementById('lockRemember').checked);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('lockOk').click(); });
  document.getElementById('lockBtn').onclick = ()=>{ lsDel('tsAppPw'); try{ sessionStorage.removeItem('tsAppPw'); }catch(e){} location.reload(); };
  document.getElementById('lockBtn').title = '잠그기';
  // 저장된 비밀번호가 있으면 자동으로 열기 (비밀번호가 바뀌었으면 지우고 입력창 표시)
  (async ()=>{
    let saved = null; try{ saved = sessionStorage.getItem('tsAppPw'); }catch(e){}
    saved = saved || lsGet('tsAppPw');
    if(saved){ const ok = await attempt(saved, false); if(!ok){ lsDel('tsAppPw'); try{ sessionStorage.removeItem('tsAppPw'); }catch(e){} err.textContent=''; } }
  })();
})();
</script>
